<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FPV 穿越机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#87ceeb;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none;
  }
  canvas { display:block; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #topbar {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:20px; padding:10px 22px; border-radius:12px;
    background:rgba(10,16,26,0.6); border:1px solid rgba(90,160,220,0.3);
    backdrop-filter:blur(8px);
  }
  .stat { display:flex; flex-direction:column; align-items:center; min-width:60px; }
  .stat .label { font-size:10px; letter-spacing:2px; color:#6b87a8; margin-bottom:2px; }
  .stat .val { font-size:19px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  /* 中央准星（机头方向） */
  #aimCenter {
    position:absolute; left:50%; top:50%; width:32px; height:32px;
    transform:translate(-50%,-50%);
  }
  #aimCenter::before, #aimCenter::after {
    content:''; position:absolute; background:rgba(255,255,255,0.9);
    box-shadow:0 0 4px rgba(0,0,0,0.6);
  }
  #aimCenter::before { left:50%; top:0; width:2px; height:32px; transform:translateX(-50%); }
  #aimCenter::after { top:50%; left:0; height:2px; width:32px; transform:translateY(-50%); }

  /* 鼠标目标圈 */
  #aimTarget {
    position:absolute; width:52px; height:52px;
    border:2px dashed rgba(120,220,255,0.75);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:border-color 0.15s;
    pointer-events:none;
  }
  #aimTarget.locked {
    border-style:solid;
    border-color:rgba(80,255,140,0.95);
    box-shadow:0 0 16px rgba(80,255,140,0.7);
  }

  /* 油门条 */
  #throttleBar {
    position:absolute; bottom:30px; left:30px;
    width:60px; height:180px;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(120,180,230,0.4);
    border-radius:8px;
    overflow:hidden;
    display:flex; flex-direction:column-reverse;
  }
  #throttleFill {
    width:100%; height:50%;
    background:linear-gradient(180deg,#22d3ee,#3b82f6);
    transition:height 0.1s linear;
  }
  #throttleLabel {
    position:absolute; bottom:220px; left:30px;
    font-size:11px; color:#8fb4d6; letter-spacing:2px;
    text-shadow:0 0 4px #000;
  }

  /* 高度显示 */
  #altDisplay {
    position:absolute; bottom:30px; right:30px;
    text-align:right;
    background:rgba(0,0,0,0.4);
    padding:8px 14px;
    border-radius:8px;
    border:1px solid rgba(120,180,230,0.3);
  }
  #altDisplay .label { font-size:10px; color:#6b87a8; letter-spacing:2px; }
  #altDisplay .val { font-size:22px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  /* 速度显示 */
  #spdDisplay {
    position:absolute; bottom:30px; right:30px; margin-right:120px;
    text-align:right;
    background:rgba(0,0,0,0.4);
    padding:8px 14px;
    border-radius:8px;
    border:1px solid rgba(120,180,230,0.3);
  }
  #spdDisplay .label { font-size:10px; color:#6b87a8; letter-spacing:2px; }
  #spdDisplay .val { font-size:22px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  #msg {
    position:absolute; left:50%; top:32%; transform:translate(-50%,-50%);
    font-size:44px; font-weight:800; letter-spacing:6px;
    color:#fff; text-shadow:0 0 20px rgba(80,200,255,0.9), 0 4px 8px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 0.3s;
  }
  #msg.show { opacity:1; }

  /* 返回按钮 */
  #backBtn {
    position:fixed; top:14px; left:14px; z-index:100;
    padding:8px 16px; border-radius:10px;
    background:rgba(10,16,26,0.7); border:1px solid rgba(90,160,220,0.4);
    color:#cfe8ff; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; text-decoration:none;
    backdrop-filter:blur(8px);
  }
  #backBtn:active { transform:scale(0.95); }

  /* 开始/结束界面 */
  #overlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(10,20,35,0.85), rgba(3,6,12,0.97));
    backdrop-filter:blur(8px);
    color:#dfe8f5;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:42px; letter-spacing:10px; font-weight:800;
    background:linear-gradient(180deg,#d6f6ff,#3fa9e0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #overlay h2 { font-size:13px; letter-spacing:4px; color:#5f7fa3; font-weight:400; }
  #overlay .keys {
    display:grid; grid-template-columns:auto auto; gap:8px 24px;
    font-size:13px; color:#8ba6c4; text-align:left; margin:8px 0;
    background:rgba(255,255,255,0.04);
    padding:14px 22px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #overlay .keys b { color:#cfe8ff; font-weight:600; }
  #ovStats { display:flex; gap:36px; margin:6px 0; }
  #ovStats > div { display:flex; flex-direction:column; gap:2px; }
  #ovStats .v { font-size:24px; font-weight:700; color:#7dd3fc; }
  #ovStats .k { font-size:11px; letter-spacing:2px; color:#5f7fa3; }

  .btn {
    margin-top:6px; padding:13px 50px; font-size:15px;
    letter-spacing:5px; font-weight:700;
    color:#04121c; background:linear-gradient(180deg,#8fe9ff,#28b6e8);
    border:none; border-radius:10px; cursor:pointer;
    box-shadow:0 0 22px rgba(50,190,255,0.45);
    font-family:inherit;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 0 34px rgba(50,190,255,0.7); }
  .btn:active { transform:translateY(0); }

  /* 触摸控件 */
  #touchControls { position:fixed; inset:0; z-index:15; display:none; pointer-events:none; }
  #touchControls.active { display:block; }

  /* 手机横屏提示 */
  #rotateTip {
    display:none; position:fixed; inset:0; z-index:9999;
    background:#06090f; color:#cfe8ff;
    flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  @media (orientation: portrait) and (max-width:900px) {
    #rotateTip { display:flex; }
  }

  .tbtn {
    position:absolute;
    pointer-events:auto;
    border-radius:50%;
    border:2px solid rgba(120,180,230,0.5);
    background:rgba(18,32,52,0.7);
    color:#cfe8ff;
    font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    touch-action:manipulation;
  }
  .tbtn.pressed { background:rgba(60,140,220,0.9); color:#fff; transform:scale(0.94); }

  #btnThrottleUp { right:24px; bottom:180px; width:80px; height:80px; font-size:26px; }
  #btnThrottleDown { right:24px; bottom:20px; width:80px; height:80px; font-size:26px; }
  #btnBrake { right:120px; bottom:20px; width:70px; height:70px; font-size:13px; }
</style>
</head>
<body>

<a id="backBtn" href="/games">← 返回</a>

<div id="rotateTip">
  <div style="font-size:56px;">📱</div>
  <div style="font-size:15px;letter-spacing:2px;">请横屏使用</div>
</div>

<div id="hud">
  <div id="topbar">
    <div class="stat"><span class="label">RINGS</span><span class="val" id="uiRings">0</span></div>
    <div class="stat"><span class="label">TIME</span><span class="val" id="uiTime">0.0</span></div>
    <div class="stat"><span class="label">BEST</span><span class="val" id="uiBest">0</span></div>
  </div>
  <div id="aimCenter"></div>
  <div id="aimTarget"></div>
  <div id="throttleBar"><div id="throttleFill"></div></div>
  <div id="throttleLabel">油门</div>
  <div id="spdDisplay">
    <div class="label">SPD</div>
    <div class="val"><span id="uiSpeed">40</span></div>
  </div>
  <div id="altDisplay">
    <div class="label">ALT</div>
    <div class="val"><span id="uiAlt">30</span></div>
  </div>
  <div id="msg"></div>
</div>

<div id="touchControls">
  <div class="tbtn" id="btnThrottleUp">▲</div>
  <div class="tbtn" id="btnThrottleDown">▼</div>
  <div class="tbtn" id="btnBrake">刹车</div>
</div>

<div id="overlay">
  <h1>FPV 穿越机</h1>
  <h2>穿越圆环，挑战最快记录</h2>
  <div id="ovStats" style="display:none">
    <div><span class="v" id="ovRings">0</span><span class="k">RINGS</span></div>
    <div><span class="v" id="ovTime">0.0</span><span class="k">TIME</span></div>
  </div>
  <div class="keys">
    <b>鼠标移动</b><span>控制飞行方向</span>
    <b>W / S</b><span>加油门 / 减油门</span>
    <b>A / D</b><span>左右微调</span>
    <b>空格 / Shift</b><span>上升 / 下降</span>
    <b>ESC</b><span>暂停</span>
  </div>
  <button class="btn" id="ovBtn">开始飞行</button>
</div>

<script type="module">
import * as THREE from '/three.module.js';

/* ============================================================
   基础场景
   ============================================================ */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 150, 700);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 3000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa55, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;
sun.shadow.camera.far = 400;
scene.add(sun);

/* ============================================================
   地面
   ============================================================ */
const GROUND_SIZE = 3000;

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 100, 100),
  new THREE.MeshStandardMaterial({ color: 0x5a8a3c, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
const gPos = ground.geometry.attributes.position;
for (let i = 0; i < gPos.count; i++) {
  const x = gPos.getX(i);
  const y = gPos.getY(i);
  const h = Math.sin(x * 0.008) * Math.cos(y * 0.008) * 20
          + Math.sin(x * 0.02 + 1.2) * 5
          + Math.cos(y * 0.015) * 4;
  gPos.setZ(i, h);
}
ground.geometry.computeVertexNormals();
scene.add(ground);

/* ============================================================
   穿越机模型
   ============================================================ */
const drone = new THREE.Group();
scene.add(drone);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.6, metalness: 0.4 });
const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 1.2), bodyMat);
body.castShadow = true;
drone.add(body);

const cpu = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.15, 0.5),
  new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.5, metalness: 0.5 })
);
cpu.position.y = 0.2;
cpu.castShadow = true;
drone.add(cpu);

const armMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.7, metalness: 0.3 });
const propMat = new THREE.MeshStandardMaterial({ color: 0x66ccff, transparent: true, opacity: 0.7, roughness: 0.2, metalness: 0.8 });
const props = [];

for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.0), armMat);
  arm.position.set(dx * 0.5, 0, dz * 0.5);
  arm.rotation.y = Math.atan2(dx, dz);
  arm.castShadow = true;
  drone.add(arm);

  const motor = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 0.25, 12),
    new THREE.MeshStandardMaterial({ color: 0x333, roughness: 0.4, metalness: 0.8 })
  );
  motor.position.set(dx * 1.0, 0.05, dz * 1.0);
  motor.castShadow = true;
  drone.add(motor);

  const prop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.15), propMat);
  prop.position.set(dx * 1.0, 0.25, dz * 1.0);
  drone.add(prop);
  props.push(prop);
}

// 机头指示灯（红）
const nose = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0xff2222 })
);
nose.position.set(0, 0.15, -0.7);
drone.add(nose);

// 尾部灯（绿）
const tail = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0x22ff44 })
);
tail.position.set(0, 0.15, 0.7);
drone.add(tail);

/* ============================================================
   圆环
   ============================================================ */
const RING_COUNT = 15;
const rings = [];
const ringGeo = new THREE.TorusGeometry(8, 0.6, 12, 48);
const ringMat = new THREE.MeshStandardMaterial({
  color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 0.5,
  roughness: 0.4, metalness: 0.6
});
const ringPassedMat = new THREE.MeshStandardMaterial({
  color: 0x22ff88, emissive: 0x22ff88, emissiveIntensity: 0.8,
  roughness: 0.4, metalness: 0.6,
  transparent: true, opacity: 0.4
});

function generateRings() {
  let lastZ = -100;
  for (let i = 0; i < rings.length; i++) {
    const ring = rings[i];
    ring.position.set(
      (Math.random() - 0.5) * 70,
      25 + (Math.random() - 0.5) * 30,
      lastZ - 50 - Math.random() * 25
    );
    ring.rotation.z = (Math.random() - 0.5) * 0.3;
    ring.userData.passed = false;
    ring.material = ringMat.clone();
    lastZ = ring.position.z;
  }
}

for (let i = 0; i < RING_COUNT; i++) {
  const ring = new THREE.Mesh(ringGeo, ringMat.clone());
  ring.castShadow = true;
  ring.userData.index = i;
  ring.userData.passed = false;
  scene.add(ring);
  rings.push(ring);
}
generateRings();

/* ============================================================
   状态
   ============================================================ */
let state = 'menu';
let ringsPassed = 0;
let startTime = 0;
let bestRings = parseInt(localStorage.getItem('fpv_best_rings') || '0', 10);

const plane = {
  pos: new THREE.Vector3(0, 30, 0),
  yaw: 0,
  pitch: 0,
  roll: 0,
  yawVel: 0,
  pitchVel: 0,
  speed: 40,
  throttle: 0.5,
  maxSpeed: 130,
  minSpeed: 15,
};

const keys = {};

/* ============================================================
   输入
   ============================================================ */
let pointerX = innerWidth / 2;
let pointerY = innerHeight / 2;

document.addEventListener('mousemove', (e) => {
  if (isTouch) return;
  pointerX = e.clientX;
  pointerY = e.clientY;
});

// 触摸：全屏拖动控制方向
let touchLookId = null;
let touchLookX = 0, touchLookY = 0;
document.addEventListener('touchstart', (e) => {
  if (!isTouch || state !== 'playing') return;
  const t = e.changedTouches[0];
  // 避开按钮区域
  if (t.target.closest && t.target.closest('.tbtn')) return;
  if (t.target.id === 'backBtn') return;
  if (touchLookId === null) {
    touchLookId = t.identifier;
    touchLookX = t.clientX;
    touchLookY = t.clientY;
    pointerX = t.clientX;
    pointerY = t.clientY;
  }
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (!isTouch || state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) {
      // 相对拖动 → 目标位置
      const dx = t.clientX - touchLookX;
      const dy = t.clientY - touchLookY;
      pointerX += dx * 1.5;
      pointerY += dy * 1.5;
      pointerX = Math.max(0, Math.min(innerWidth, pointerX));
      pointerY = Math.max(0, Math.min(innerHeight, pointerY));
      touchLookX = t.clientX;
      touchLookY = t.clientY;
      e.preventDefault();
    }
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!isTouch) return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) touchLookId = null;
  }
});

// 键盘
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape') {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('已暂停', '按 ESC 继续', '继续飞行', false);
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

// 触摸按钮：油门
function bindHold(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); el.classList.add('pressed'); onDown(); }, { passive: false });
  el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp && onUp(); }, { passive: false });
  el.addEventListener('touchcancel', () => { el.classList.remove('pressed'); onUp && onUp(); });
}
let touchThrottleUp = false, touchThrottleDown = false, touchBrake = false;
bindHold('btnThrottleUp', () => { touchThrottleUp = true; }, () => { touchThrottleUp = false; });
bindHold('btnThrottleDown', () => { touchThrottleDown = true; }, () => { touchThrottleDown = false; });
bindHold('btnBrake', () => { touchBrake = true; }, () => { touchBrake = false; });

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
const aimTargetEl = document.getElementById('aimTarget');
const MAX_YAW_VEL = 1.8;    // 最大偏航角速度（弧度/秒）
const MAX_PITCH_VEL = 1.4;  // 最大俯仰角速度
const DEADZONE = 0.08;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 螺旋桨旋转
  const propSpeed = state === 'playing' ? 50 : 8;
  for (const p of props) p.rotation.y += propSpeed * dt;

  if (state === 'playing') {
    // ===== 鼠标位置 → 归一化 [-1, 1] =====
    let mx = (pointerX / innerWidth) * 2 - 1;
    let my = (pointerY / innerHeight) * 2 - 1;

    // 死区
    if (Math.abs(mx) < DEADZONE) mx = 0;
    else mx = (mx - Math.sign(mx) * DEADZONE) / (1 - DEADZONE);

    if (Math.abs(my) < DEADZONE) my = 0;
    else my = (my - Math.sign(my) * DEADZONE) / (1 - DEADZONE);

    // 鼠标位置越靠边，转向越快
    const targetYawVel = -mx * MAX_YAW_VEL;
    const targetPitchVel = -my * MAX_PITCH_VEL;

    // 平滑
    plane.yawVel += (targetYawVel - plane.yawVel) * dt * 5;
    plane.pitchVel += (targetPitchVel - plane.pitchVel) * dt * 5;

    // 键盘微调
    if (keys['KeyA'] || keys['ArrowLeft']) plane.yawVel -= 1.0 * dt * 8;
    if (keys['KeyD'] || keys['ArrowRight']) plane.yawVel += 1.0 * dt * 8;

    // 应用角速度
    plane.yaw += plane.yawVel * dt;
    plane.pitch += plane.pitchVel * dt;

    // 俯仰限制
    plane.pitch = Math.max(-1.3, Math.min(1.3, plane.pitch));

    // ===== 自动滚转（转弯时倾斜） =====
    const targetRoll = -mx * 0.7;
    plane.roll += (targetRoll - plane.roll) * dt * 5;

    // ===== 油门 =====
    if (keys['KeyW'] || keys['ArrowUp'] || touchThrottleUp) {
      plane.throttle = Math.min(1, plane.throttle + dt * 0.5);
    }
    if (keys['KeyS'] || keys['ArrowDown'] || touchThrottleDown) {
      plane.throttle = Math.max(0, plane.throttle - dt * 0.5);
    }

    // 刹车
    if (touchBrake || keys['ShiftLeft'] || keys['ShiftRight']) {
      plane.speed *= (1 - dt * 1.5);
    }

    // 目标速度
    const targetSpeed = plane.minSpeed + plane.throttle * (plane.maxSpeed - plane.minSpeed);
    plane.speed += (targetSpeed - plane.speed) * dt * 1.5;

    // ===== 垂直分量（俯仰影响高度） =====
    const verticalFromPitch = Math.sin(plane.pitch) * plane.speed;

    // ===== 移动 =====
    const dir = new THREE.Vector3(
      -Math.sin(plane.yaw),
      0,
      -Math.cos(plane.yaw)
    );
    // 按 cos(pitch) 修正水平速度
    const horizSpeed = plane.speed * Math.cos(plane.pitch);
    plane.pos.x += dir.x * horizSpeed * dt;
    plane.pos.z += dir.z * horizSpeed * dt;
    plane.pos.y += verticalFromPitch * dt;

    // 键盘升降
    if (keys['Space']) plane.pos.y += 25 * dt;

    // 边界
    const limit = GROUND_SIZE / 2 - 50;
    plane.pos.x = Math.max(-limit, Math.min(limit, plane.pos.x));
    plane.pos.z = Math.max(-limit, Math.min(limit, plane.pos.z));

    // 高度限制
    if (plane.pos.y < 3) { plane.pos.y = 3; plane.pitch = Math.min(0, plane.pitch); }
    if (plane.pos.y > 250) plane.pos.y = 250;

    // ===== 应用姿态 =====
    drone.position.copy(plane.pos);
    drone.rotation.order = 'YXZ';
    drone.rotation.y = plane.yaw;
    drone.rotation.x = plane.pitch;
    drone.rotation.z = plane.roll;

    // ===== 第三人称相机 =====
    const camEuler = new THREE.Euler(plane.pitch * 0.7, plane.yaw, 0, 'YXZ');
    const camBack = new THREE.Vector3(0, 6, 24).applyEuler(camEuler);
    const camTargetPos = plane.pos.clone().add(camBack);

    // 地面保护
    if (camTargetPos.y < 2) camTargetPos.y = 2;

    camera.position.lerp(camTargetPos, dt * 5);

    // 看向飞机前方一点
    const lookAhead = plane.pos.clone().add(
      new THREE.Vector3(0, 0, -1).applyEuler(camEuler).multiplyScalar(20)
    );
    camera.lookAt(lookAhead);

    // ===== 目标圈跟随鼠标位置 =====
    aimTargetEl.style.left = pointerX + 'px';
    aimTargetEl.style.top = pointerY + 'px';

    // 鼠标在中央 → 锁定变色
    const distFromCenter = Math.hypot(pointerX - innerWidth / 2, pointerY - innerHeight / 2);
    if (distFromCenter < 40) aimTargetEl.classList.add('locked');
    else aimTargetEl.classList.remove('locked');

    // ===== 圆环穿越检测 =====
    for (const ring of rings) {
      if (ring.userData.passed) continue;

      // 检测无人机是否穿过圆环平面（Z 方向）
      const ringZ = ring.position.z;
      const prevZ = plane.pos.z - dir.z * horizSpeed * dt;
      const currZ = plane.pos.z;

      if (prevZ > ringZ && currZ <= ringZ) {
        const dx = plane.pos.x - ring.position.x;
        const dy = plane.pos.y - ring.position.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 8) {
          ring.userData.passed = true;
          ring.material = ringPassedMat.clone();
          ringsPassed++;
          document.getElementById('uiRings').textContent = ringsPassed;
          showMsg('+1 穿越！', 700);
        }
      }
    }

    // ===== HUD 更新 =====
    const elapsed = (performance.now() - startTime) / 1000;
    document.getElementById('uiTime').textContent = elapsed.toFixed(1);
    document.getElementById('uiSpeed').textContent = Math.round(plane.speed);
    document.getElementById('uiAlt').textContent = Math.round(plane.pos.y);
    document.getElementById('throttleFill').style.height = (plane.throttle * 100) + '%';

    // 结束条件
    if (ringsPassed >= RING_COUNT) {
      gameOver('全部穿越！', true);
    } else if (plane.pos.z < -2000) {
      gameOver('飞太远了！');
    }
  }

  renderer.render(scene, camera);
}

/* ============================================================
   消息
   ============================================================ */
const msgEl = document.getElementById('msg');
let msgTimer = null;
function showMsg(text, duration = 1000) {
  msgEl.textContent = text;
  msgEl.classList.add('show');
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msgEl.classList.remove('show'), duration);
}

/* ============================================================
   开始/结束
   ============================================================ */
const overlay = document.getElementById('overlay');
const ovBtn = document.getElementById('ovBtn');
const ovStats = document.getElementById('ovStats');

function hideOverlay() { overlay.classList.add('hidden'); }
function showOverlay(title, sub, btnText, showStats = false) {
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = title;
  overlay.querySelector('h2').textContent = sub;
  ovBtn.textContent = btnText;
  ovStats.style.display = showStats ? 'flex' : 'none';
  if (showStats) {
    document.getElementById('ovRings').textContent = ringsPassed;
    document.getElementById('ovTime').textContent = ((performance.now() - startTime) / 1000).toFixed(1);
  }
}

function resetGame() {
  ringsPassed = 0;
  plane.pos.set(0, 30, 0);
  plane.yaw = 0;
  plane.pitch = 0;
  plane.roll = 0;
  plane.yawVel = 0;
  plane.pitchVel = 0;
  plane.speed = 40;
  plane.throttle = 0.5;

  generateRings();

  document.getElementById('uiRings').textContent = '0';
  document.getElementById('uiTime').textContent = '0.0';
  document.getElementById('uiBest').textContent = bestRings;

  pointerX = innerWidth / 2;
  pointerY = innerHeight / 2;
}

function startGame() {
  resetGame();
  state = 'playing';
  startTime = performance.now();
  hideOverlay();
}

function gameOver(reason, allCleared = false) {
  state = 'dead';
  const elapsed = (performance.now() - startTime) / 1000;

  if (ringsPassed > bestRings) {
    bestRings = ringsPassed;
    localStorage.setItem('fpv_best_rings', String(bestRings));
    document.getElementById('uiBest').textContent = bestRings;
  }

  showOverlay('飞行结束', reason, '再来一次', true);

  try {
    const playerName = localStorage.getItem('player_name') || '匿名玩家';
    const score = ringsPassed * 100 + Math.max(0, Math.floor(3000 - elapsed * 10));
    fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game_key: 'fpv',
        device_id: localStorage.getItem('device_id') || null,
        player_name: playerName,
        score: score,
        wave: ringsPassed,
        kills: 0,
        duration: Math.floor(elapsed),
      }),
    }).catch(() => {});
  } catch {}
}

ovBtn.addEventListener('click', startGame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('uiBest').textContent = bestRings;

// 手机显示触摸控件
if (isTouch) {
  document.getElementById('touchControls').classList.add('active');
}

animate();
</script>
