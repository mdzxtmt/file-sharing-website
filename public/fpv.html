<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAS 近距离空中支援</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#87ceeb;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none;
  }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }

  #topbar {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; padding:10px 22px; border-radius:12px;
    background:rgba(10,16,26,0.65); border:1px solid rgba(90,160,220,0.3);
    backdrop-filter:blur(8px);
  }
  .stat { display:flex; flex-direction:column; align-items:center; min-width:56px; }
  .stat .label { font-size:10px; letter-spacing:2px; color:#6b87a8; margin-bottom:2px; }
  .stat .val { font-size:19px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  /* 中央机头准星 */
  #crosshair {
    position:absolute; left:50%; top:50%; width:36px; height:36px;
    transform:translate(-50%,-50%);
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(80,255,120,0.95);
    box-shadow:0 0 6px rgba(0,255,80,0.7);
  }
  #crosshair::before { left:50%; top:0; width:2px; height:36px; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:36px; transform:translateY(-50%); }
  #crosshair .dot {
    position:absolute; left:50%; top:50%; width:4px; height:4px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:rgba(80,255,120,0.95);
    box-shadow:0 0 6px rgba(0,255,80,0.7);
  }

  /* 鼠标目标圈 */
  #aimTarget {
    position:absolute; width:50px; height:50px;
    border:2px solid rgba(120,220,255,0.85);
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(0,0,0,0.5);
    transition:border-color 0.1s;
  }
  #aimTarget.locked {
    border-color:rgba(80,255,140,0.95);
    box-shadow:0 0 18px rgba(80,255,140,0.7);
  }

  /* 左下：油门 + 武器 */
  #leftPanel {
    position:absolute; left:20px; bottom:20px;
    display:flex; flex-direction:column; gap:8px;
  }
  #throttlePanel { display:flex; align-items:center; gap:10px; }
  #throttleBar {
    width:22px; height:120px;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(120,180,230,0.4);
    border-radius:6px;
    overflow:hidden;
    display:flex; flex-direction:column-reverse;
  }
  #throttleFill {
    width:100%; height:60%;
    background:linear-gradient(180deg,#22d3ee,#3b82f6);
    transition:height 0.08s linear;
  }
  #throttleText {
    color:#cfe8ff; font-size:11px; font-weight:700;
    font-family:monospace;
    text-shadow:0 0 4px #000;
  }
  #weaponDisplay {
    display:flex; gap:4px; flex-direction:column;
  }
  .wpn {
    padding:5px 10px; border-radius:6px; font-size:11px;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(120,180,230,0.3);
    color:#8fb4d6;
    font-weight:600;
    letter-spacing:1px;
  }
  .wpn.active {
    background:linear-gradient(90deg,#ff8844,#ff3322);
    color:#fff;
    border-color:transparent;
    box-shadow:0 0 12px rgba(255,100,60,0.5);
  }
  .wpn .ammo { font-family:monospace; margin-left:6px; color:inherit; opacity:0.85; }

  /* 右下：速度/高度 */
  #infoPanel {
    position:absolute; right:20px; bottom:20px;
    display:flex; gap:10px;
  }
  #infoPanel > div {
    background:rgba(0,0,0,0.45);
    padding:8px 14px;
    border-radius:8px;
    border:1px solid rgba(120,180,230,0.3);
    text-align:center;
  }
  #infoPanel .label { font-size:10px; color:#6b87a8; letter-spacing:2px; }
  #infoPanel .val { font-size:19px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  #msg {
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    font-size:40px; font-weight:800; letter-spacing:5px;
    color:#fff; text-shadow:0 0 20px rgba(255,150,50,0.9), 0 4px 8px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 0.3s;
  }
  #msg.show { opacity:1; }

  /* 目标列表 */
  #targetList {
    position:absolute; right:20px; top:80px;
    background:rgba(0,0,0,0.45);
    padding:10px 14px;
    border-radius:8px;
    border:1px solid rgba(120,180,230,0.3);
    min-width:160px;
    max-height:280px;
    overflow-y:auto;
  }
  #targetList h3 {
    font-size:11px; letter-spacing:2px; color:#6b87a8;
    margin-bottom:6px; font-weight:600;
  }
  #targetList .item {
    font-size:11px; color:#a5e8ff; padding:3px 0;
    font-family:monospace;
  }
  #targetList .item.destroyed { color:#666; text-decoration:line-through; }

  /* 返回 & 切换 */
  #backBtn {
    position:fixed; top:14px; left:14px; z-index:100;
    padding:8px 16px; border-radius:10px;
    background:rgba(10,16,26,0.7); border:1px solid rgba(90,160,220,0.4);
    color:#cfe8ff; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; text-decoration:none;
    backdrop-filter:blur(8px);
  }
  #backBtn:active { transform:scale(0.95); }

  #ctrlToggle {
    position:fixed; top:14px; left:100px; z-index:100;
    padding:8px 14px; border-radius:10px;
    background:rgba(10,16,26,0.7); border:1px solid rgba(90,160,220,0.4);
    color:#cfe8ff; font-size:12px; font-weight:600;
    cursor:pointer; font-family:inherit;
    backdrop-filter:blur(8px);
  }
  #ctrlToggle:active { transform:scale(0.95); }

  /* 开始界面 */
  #overlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(10,20,35,0.85), rgba(3,6,12,0.97));
    backdrop-filter:blur(8px);
    color:#dfe8f5;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:40px; letter-spacing:8px; font-weight:800;
    background:linear-gradient(180deg,#d6f6ff,#3fa9e0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #overlay h2 { font-size:12px; letter-spacing:4px; color:#5f7fa3; font-weight:400; }
  #overlay .keys {
    display:grid; grid-template-columns:auto auto; gap:7px 22px;
    font-size:13px; color:#8ba6c4; text-align:left; margin:8px 0;
    background:rgba(255,255,255,0.04);
    padding:14px 22px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #overlay .keys b { color:#cfe8ff; font-weight:600; }
  #ovStats { display:flex; gap:32px; margin:6px 0; }
  #ovStats > div { display:flex; flex-direction:column; gap:2px; }
  #ovStats .v { font-size:24px; font-weight:700; color:#7dd3fc; }
  #ovStats .k { font-size:11px; letter-spacing:2px; color:#5f7fa3; }

  .btn {
    margin-top:6px; padding:13px 50px; font-size:15px;
    letter-spacing:5px; font-weight:700;
    color:#04121c; background:linear-gradient(180deg,#8fe9ff,#28b6e8);
    border:none; border-radius:10px; cursor:pointer;
    box-shadow:0 0 22px rgba(50,190,255,0.45);
    font-family:inherit;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 0 34px rgba(50,190,255,0.7); }

  #touchControls { position:fixed; inset:0; z-index:15; display:none; pointer-events:none; }
  #touchControls.active { display:block; }

  #rotateTip {
    display:none; position:fixed; inset:0; z-index:9999;
    background:#06090f; color:#cfe8ff;
    flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  @media (orientation: portrait) and (max-width:900px) {
    #rotateTip { display:flex; }
  }

  .tbtn {
    position:absolute;
    pointer-events:auto;
    border-radius:50%;
    border:2px solid rgba(120,180,230,0.5);
    background:rgba(18,32,52,0.75);
    color:#cfe8ff;
    font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    touch-action:manipulation;
  }
  .tbtn.pressed { background:rgba(60,140,220,0.9); color:#fff; transform:scale(0.94); }

  #btnThrottleUp { right:24px; bottom:180px; width:76px; height:76px; font-size:24px; }
  #btnThrottleDown { right:24px; bottom:20px; width:76px; height:76px; font-size:24px; }
  #btnFire { right:116px; bottom:20px; width:86px; height:86px; font-size:13px;
    background:rgba(80,20,20,0.8); border-color:rgba(255,100,80,0.7); color:#ffd0c8; }
  #btnWeapon { right:116px; bottom:120px; width:70px; height:70px; font-size:12px;
    background:rgba(60,40,10,0.8); border-color:rgba(255,180,60,0.6); color:#ffcc88; }
</style>
</head>
<body>

<a id="backBtn" href="/games">← 返回</a>
<button id="ctrlToggle">控制: 键鼠</button>

<div id="rotateTip">
  <div style="font-size:56px;">📱</div>
  <div style="font-size:15px;letter-spacing:2px;">请横屏使用</div>
</div>

<div id="hud">
  <div id="topbar">
    <div class="stat"><span class="label">SCORE</span><span class="val" id="uiScore">0</span></div>
    <div class="stat"><span class="label">TARGETS</span><span class="val" id="uiKills">0/12</span></div>
    <div class="stat"><span class="label">TIME</span><span class="val" id="uiTime">0.0</span></div>
  </div>

  <div id="crosshair"><div class="dot"></div></div>
  <div id="aimTarget"></div>

  <div id="leftPanel">
    <div id="throttlePanel">
      <div id="throttleBar"><div id="throttleFill"></div></div>
      <div id="throttleText">60%</div>
    </div>
    <div id="weaponDisplay">
      <div class="wpn active" data-w="cannon">机炮<span class="ammo" id="ammoCannon">∞</span></div>
      <div class="wpn" data-w="rocket">火箭弹<span class="ammo" id="ammoRocket">14</span></div>
      <div class="wpn" data-w="bomb">炸弹<span class="ammo" id="ammoBomb">6</span></div>
    </div>
  </div>

  <div id="infoPanel">
    <div>
      <div class="label">SPD</div>
      <div class="val"><span id="uiSpeed">0</span></div>
    </div>
    <div>
      <div class="label">ALT</div>
      <div class="val"><span id="uiAlt">0</span></div>
    </div>
  </div>

  <div id="targetList">
    <h3>地面目标</h3>
    <div id="targetItems"></div>
  </div>

  <div id="msg"></div>
</div>

<div id="touchControls">
  <div class="tbtn" id="btnThrottleUp">▲</div>
  <div class="tbtn" id="btnThrottleDown">▼</div>
  <div class="tbtn" id="btnFire">开火</div>
  <div class="tbtn" id="btnWeapon">切换</div>
</div>

<div id="overlay">
  <h1>CAS 近距支援</h1>
  <h2>摧毁所有地面目标</h2>
  <div id="ovStats" style="display:none">
    <div><span class="v" id="ovScore">0</span><span class="k">SCORE</span></div>
    <div><span class="v" id="ovKills">0</span><span class="k">TARGETS</span></div>
    <div><span class="v" id="ovTime">0.0</span><span class="k">TIME</span></div>
  </div>
  <div class="keys">
    <b>鼠标移动</b><span>牵引机头方向</span>
    <b>W / S</b><span>加 / 减油门</span>
    <b>1 / 2 / 3</b><span>切换武器</span>
    <b>空格 / 左键</b><span>开火</span>
    <b>A / D</b><span>左右滚转</span>
    <b>ESC</b><span>暂停</span>
  </div>
  <button class="btn" id="ovBtn">起飞</button>
</div>

<script type="module">
import * as THREE from '/three.module.js';

/* ============================================================
   控制模式
   ============================================================ */
let controlMode = (() => {
  try {
    const saved = localStorage.getItem('cas_control');
    if (saved === 'touch' || saved === 'keyboard') return saved;
  } catch {}
  return 'keyboard';
})();

let isTouch = controlMode === 'touch';

function updateCtrlBtn() {
  const el = document.getElementById('ctrlToggle');
  if (el) el.textContent = '控制: ' + (isTouch ? '触屏' : '键鼠');
}

function toggleCtrlMode() {
  controlMode = isTouch ? 'keyboard' : 'touch';
  isTouch = controlMode === 'touch';
  try { localStorage.setItem('cas_control', controlMode); } catch {}
  updateCtrlBtn();
  applyCtrlMode();
}

function applyCtrlMode() {
  const tc = document.getElementById('touchControls');
  if (!tc) return;
  if (isTouch) tc.classList.add('active');
  else tc.classList.remove('active');
}

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 1500, 6000);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 12000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 0.9));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.3);
sun.position.set(500, 800, 400);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -600;
sun.shadow.camera.right = 600;
sun.shadow.camera.top = 600;
sun.shadow.camera.bottom = -600;
sun.shadow.camera.far = 3000;
scene.add(sun);

/* ============================================================
   天空
   ============================================================ */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2;
skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
skyGrad.addColorStop(0, '#1a5ba8');
skyGrad.addColorStop(0.5, '#6ca6cd');
skyGrad.addColorStop(1, '#d0e4f5');
skyCtx.fillStyle = skyGrad;
skyCtx.fillRect(0, 0, 2, 512);
const skydome = new THREE.Mesh(
  new THREE.SphereGeometry(9000, 32, 16),
  new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(skyCanvas),
    side: THREE.BackSide,
    fog: false,
  })
);
scene.add(skydome);

/* ============================================================
   地面
   ============================================================ */
const GROUND_SIZE = 16000;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 120, 120),
  new THREE.MeshStandardMaterial({ color: 0x6b8e3a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
const gPos = ground.geometry.attributes.position;
for (let i = 0; i < gPos.count; i++) {
  const x = gPos.getX(i);
  const y = gPos.getY(i);
  const h = Math.sin(x * 0.0006) * Math.cos(y * 0.0006) * 60
          + Math.sin(x * 0.0015 + 1.2) * 25
          + Math.cos(y * 0.001) * 15;
  gPos.setZ(i, h);
}
ground.geometry.computeVertexNormals();
scene.add(ground);

/* ============================================================
   云层
   ============================================================ */
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudMat = new THREE.MeshLambertMaterial({
  color: 0xffffff, transparent: true, opacity: 0.7,
});

for (let i = 0; i < 80; i++) {
  const cluster = new THREE.Group();
  const blocks = 5 + Math.floor(Math.random() * 5);
  for (let j = 0; j < blocks; j++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cloudMat);
    c.scale.set(
      250 + Math.random() * 500,
      80 + Math.random() * 120,
      250 + Math.random() * 500
    );
    c.position.set(
      (Math.random() - 0.5) * 800,
      (Math.random() - 0.5) * 100,
      (Math.random() - 0.5) * 800
    );
    cluster.add(c);
  }
  cluster.position.set(
    (Math.random() - 0.5) * 14000,
    700 + Math.random() * 1000,
    (Math.random() - 0.5) * 14000
  );
  cloudGroup.add(cluster);
}

/* ============================================================
   玩家战机
   ============================================================ */
const jet = new THREE.Group();
scene.add(jet);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5a6b7a, roughness: 0.5, metalness: 0.7 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.6, metalness: 0.5 });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x88ccff, transparent: true, opacity: 0.4,
  roughness: 0.1, metalness: 0.9,
  emissive: 0x224466, emissiveIntensity: 0.3,
});
const engineMat = new THREE.MeshBasicMaterial({ color: 0xff8800 });

const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 0.8, 9, 12), bodyMat);
fuselage.rotation.x = Math.PI / 2;
fuselage.castShadow = true;
jet.add(fuselage);

const noseCone = new THREE.Mesh(
  new THREE.ConeGeometry(1.0, 3.5, 12).rotateX(-Math.PI / 2),
  darkMat
);
noseCone.position.set(0, 0, -6.2);
noseCone.castShadow = true;
jet.add(noseCone);

const canopy = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  glassMat
);
canopy.scale.set(1, 1.3, 3.0);
canopy.position.set(0, 0.8, -2.5);
jet.add(canopy);

const wingShape = new THREE.Shape();
wingShape.moveTo(0, 2);
wingShape.lineTo(6, -1.2);
wingShape.lineTo(6, -2.2);
wingShape.lineTo(0, -2.6);
wingShape.lineTo(0, 2);
const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
  depth: 0.18, bevelEnabled: false,
}).rotateX(Math.PI / 2);

const rightWing = new THREE.Mesh(wingGeo, bodyMat);
rightWing.position.set(0.8, -0.1, -0.6);
rightWing.castShadow = true;
jet.add(rightWing);

const leftWing = new THREE.Mesh(wingGeo, bodyMat);
leftWing.scale.x = -1;
leftWing.position.set(-0.8, -0.1, -0.6);
leftWing.castShadow = true;
jet.add(leftWing);

const vTailShape = new THREE.Shape();
vTailShape.moveTo(0, 0);
vTailShape.lineTo(0.35, 2.5);
vTailShape.lineTo(0.9, 2.5);
vTailShape.lineTo(0.7, 0.3);
vTailShape.lineTo(0, 0);
const vTail = new THREE.Mesh(
  new THREE.ExtrudeGeometry(vTailShape, { depth: 0.15, bevelEnabled: false }),
  bodyMat
);
vTail.position.set(-0.08, 0.7, 3.5);
vTail.castShadow = true;
jet.add(vTail);

const hTailGeo = new THREE.BoxGeometry(2.2, 0.15, 1.2);
for (const side of [-1, 1]) {
  const hTail = new THREE.Mesh(hTailGeo, bodyMat);
  hTail.position.set(side * 1.5, 0, 3.8);
  hTail.castShadow = true;
  jet.add(hTail);
}

const engine = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 1.0, 1.2, 12).rotateX(Math.PI / 2),
  darkMat
);
engine.position.set(0, 0, 4.8);
jet.add(engine);

const flame = new THREE.Mesh(
  new THREE.ConeGeometry(0.65, 3.0, 8).rotateX(Math.PI / 2),
  engineMat
);
flame.position.set(0, 0, 6.5);
jet.add(flame);

// 挂载点（机翼下）
const hardpoints = [
  { pos: new THREE.Vector3(-5, -0.3, -1) },
  { pos: new THREE.Vector3(5, -0.3, -1) },
  { pos: new THREE.Vector3(-5, -0.3, 0.5) },
  { pos: new THREE.Vector3(5, -0.3, 0.5) },
];

jet.position.set(0, 1500, 0);

/* ============================================================
   地面目标生成
   ============================================================ */
const targets = [];

function createTank(x, z, type = 'tank') {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  let bodyColor, turretColor, health;

  if (type === 'tank') {
    bodyColor = 0x4a5a3a;
    turretColor = 0x3a4a2a;
    health = 100;
  } else if (type === 'aa') {
    bodyColor = 0x8a7a4a;
    turretColor = 0x6a5a2a;
    health = 60;
  } else {
    bodyColor = 0x6a6a6a;
    turretColor = 0x5a5a5a;
    health = 150;
  }

  const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.85, metalness: 0.2 });
  const turretMat = new THREE.MeshStandardMaterial({ color: turretColor, roughness: 0.8, metalness: 0.3 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });

  // 履带/底盘
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 9), bodyMat);
  chassis.position.y = 1.5;
  chassis.castShadow = true;
  g.add(chassis);

  // 炮塔
  const turret = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2, 5), turretMat);
  turret.position.y = 3.5;
  turret.castShadow = true;
  g.add(turret);

  // 炮管
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 7, 8).rotateX(Math.PI / 2), darkMat);
  barrel.position.set(0, 3.8, -5);
  barrel.castShadow = true;
  g.add(barrel);

  // 天线
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3, 4), darkMat);
  antenna.position.set(-2, 5, 1);
  g.add(antenna);

  // 命中提示（顶部小旗子）
  const flagMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.5), flagMat);
  flag.position.set(0, 7, 0);
  flag.userData.isFlag = true;
  g.add(flag);

  scene.add(g);

  targets.push({
    group: g,
    type,
    hp: health,
    maxHp: health,
    alive: true,
    flag,
    flagPhase: Math.random() * Math.PI * 2,
    turret,
    barrel,
    lastFireTime: 0,
    fireInterval: type === 'aa' ? 0.5 : 2.5,
  });

  return targets[targets.length - 1];
}

  if (t.target.closest && t.target.closest('.tbtn')) return;

  if (touchLookId === null) {
    touchLookId = t.identifier;
    mouseNDC.x = (t.clientX / innerWidth) * 2 - 1;
    mouseNDC.y = -(t.clientY / innerHeight) * 2 + 1;
  }
}, { passive: false });

  for (const t of e.changedTouches) {

      mouseNDC.y = -(t.clientY / innerHeight) * 2 + 1;
      e.preventDefault();
    }

});

function bindHold(id, onDown, onUp) {

  el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp && onUp(); }, { passive: false });
  el.addEventListener('touchcancel', () => { el.classList.remove('pressed'); onUp && onUp(); });
}

const bullets = [];
const rockets = [];
const bombs = [];

const bulletGeo = new THREE.SphereGeometry(0.8, 6, 6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
const rocketGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 8).rotateX(Math.PI / 2);
const rocketMat = new THREE.MeshStandardMaterial({ color: 0x8a4a3a, emissive: 0xff4400, emissiveIntensity: 0.5 });
const bombGeo = new THREE.SphereGeometry(1.5, 8, 8);
const bombMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.6 });

// 获取机头方向的世界坐标
function getMuzzleWorld() {
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(jet.quaternion);
  return jet.position.clone().add(forward.multiplyScalar(8));
}

// 获取机头方向的单位向量
function getForwardDir() {
  return new THREE.Vector3(0, 0, -1).applyQuaternion(jet.quaternion);
}

function fireCannon() {
  if (jetState.fireCooldown > 0) return;
  jetState.fireCooldown = 0.08;

  const dir = getForwardDir();
  const spawn = getMuzzleWorld();
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(spawn);
  scene.add(b);

  bullets.push({
    mesh: b,
    vel: dir.multiplyScalar(1100),
    life: 2.5,
    damage: 15,
  });
}

function fireRocket() {
  if (jetState.rocketCooldown > 0) return;
  if (jetState.weapons.rocket.ammo <= 0) return;
  jetState.weapons.rocket.ammo--;
  document.getElementById('ammoRocket').textContent = jetState.weapons.rocket.ammo;
  jetState.rocketCooldown = 0.35;

  const dir = getForwardDir();

  // 从机翼挂载点发射
  for (let i = 0; i < 2; i++) {
    const hardpoint = hardpoints[i].pos.clone().applyQuaternion(jet.quaternion).add(jet.position);
    const r = new THREE.Mesh(rocketGeo, rocketMat);

    // 稍微向下的初始方向
    const rDir = dir.clone();
    rDir.y -= 0.05;
    rDir.normalize();

    r.position.copy(hardpoint);
    r.quaternion.copy(jet.quaternion);
    scene.add(r);

    rockets.push({
      mesh: r,
      vel: rDir.multiplyScalar(400),
      life: 6,
      damage: 80,
    });
  }

  if (jetState.weapons.rocket.ammo <= 0) {
    setTimeout(() => switchWeapon('cannon'), 100);
  }
}

function dropBomb() {
  if (jetState.bombCooldown > 0) return;
  if (jetState.weapons.bomb.ammo <= 0) return;
  jetState.weapons.bomb.ammo--;
  document.getElementById('ammoBomb').textContent = jetState.weapons.bomb.ammo;
  jetState.bombCooldown = 0.8;

  const forward = getForwardDir();
  const spawn = jet.position.clone().add(new THREE.Vector3(0, -3, 0));

  const b = new THREE.Mesh(bombGeo, bombMat);
  b.position.copy(spawn);
  scene.add(b);

  bombs.push({
    mesh: b,
    vel: forward.clone().multiplyScalar(jetState.speed * 0.8),
    life: 12,
    damage: 250,
  });

  if (jetState.weapons.bomb.ammo <= 0) {
    setTimeout(() => switchWeapon('cannon'), 100);
  }
}

function fireCurrentWeapon() {
  if (jetState.currentWeapon === 'cannon') fireCannon();
  else if (jetState.currentWeapon === 'rocket') fireRocket();
  else if (jetState.currentWeapon === 'bomb') dropBomb();
}

   伤害目标
   ============================================================ */
function damageTarget(target, damage, hitPos) {
  if (!target.alive) return;

  target.hp -= damage;
  spawnHitEffect(hitPos);

  if (target.hp <= 0) {
    target.alive = false;
    scene.remove(target.group);
    kills++;
    score += target.type === 'tank' ? 100 : target.type === 'aa' ? 150 : 80;
    document.getElementById('uiKills').textContent = `${kills}/${targets.length}`;
    document.getElementById('uiScore').textContent = score;
    updateTargetList();

    // 大爆炸
    spawnExplosion(target.group.position.clone());
    spawnExplosion(target.group.position.clone().add(new THREE.Vector3(3, 2, -3)));
    spawnExplosion(target.group.position.clone().add(new THREE.Vector3(-3, 2, 3)));

    showMsg('目标摧毁！+' + (target.type === 'tank' ? 100 : target.type === 'aa' ? 150 : 80), 800);
  } else {
    showMsg('命中！', 300);
  }
}

/* ============================================================
   更新武器
   ============================================================ */
function updateWeapons(dt) {
  // 机炮
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.mesh.position.addScaledVector(b.vel, dt);

    let dead = b.life <= 0;

    if (!dead) {
      const hit = checkHit(b.mesh.position, b.damage);
      if (hit) dead = true;
    }

    if (dead) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // 火箭弹
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.life -= dt;

    // 火箭弹有轻微重力
    r.vel.y -= 9.8 * dt;
    r.mesh.position.addScaledVector(r.vel, dt);

    // 朝向速度方向
    const dir = r.vel.clone().normalize();
    r.mesh.lookAt(r.mesh.position.clone().add(dir));

    let dead = r.life <= 0;

    if (!dead) {
      const hit = checkHit(r.mesh.position, r.damage);
      if (hit) dead = true;
    }

    // 撞地
    if (!dead && r.mesh.position.y < 0) {
      dead = true;
      spawnExplosion(r.mesh.position.clone());
    }

    if (dead) {
      scene.remove(r.mesh);
      rockets.splice(i, 1);
    }
  }

  // 炸弹
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.life -= dt;

    // 炸弹有重力
    b.vel.y -= 20 * dt;
    b.mesh.position.addScaledVector(b.vel, dt);

    let dead = b.life <= 0;

    // 撞地爆炸
    if (!dead && b.mesh.position.y < 0) {
      dead = true;
      spawnExplosion(b.mesh.position.clone());
      // 范围伤害
      for (const t of targets) {
        if (!t.alive) continue;
        const d = t.group.position.distanceTo(b.mesh.position);
        if (d < 80) {
          const dmg = b.damage * (1 - d / 80);
          damageTarget(t, dmg, t.group.position.clone());
        }
      }
    }

    if (!dead) {
      const hit = checkHit(b.mesh.position, b.damage);
      if (hit) {
        dead = true;
        spawnExplosion(b.mesh.position.clone());
        // 范围伤害
        for (const t of targets) {
          if (!t.alive) continue;
          const d = t.group.position.distanceTo(b.mesh.position);
          if (d < 80) {
            const dmg = b.damage * (1 - d / 80);
            damageTarget(t, dmg, t.group.position.clone());
          }
        }
      }
    }

    if (dead) {
      scene.remove(b.mesh);
      bombs.splice(i, 1);
    }
  }
}

function checkHit(pos, damage) {
  for (const t of targets) {
    if (!t.alive) continue;
    const d = t.group.position.distanceTo(pos);
    if (d < 8) {
      damageTarget(t, damage, pos.clone());
      return true;
    }
  }
  return false;
}

const effects = [];

function spawnExplosion(pos) {
  // 火球
  const geo = new THREE.SphereGeometry(20, 12, 12);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff6600, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.position.y += 10;
  scene.add(mesh);
  effects.push({ mesh, life: 1.0, maxLife: 1.0, type: 'exp' });

  // 烟雾
  const smokeGeo = new THREE.SphereGeometry(25, 8, 8);
  const smokeMat = new THREE.MeshBasicMaterial({
    color: 0x333333, transparent: true, opacity: 0.7,
  });
  const smoke = new THREE.Mesh(smokeGeo, smokeMat);
  smoke.position.copy(pos);
  smoke.position.y += 25;
  scene.add(smoke);
  effects.push({ mesh: smoke, life: 3.0, maxLife: 3.0, type: 'smoke' });
}

function spawnHitEffect(pos) {
  const geo = new THREE.SphereGeometry(8, 8, 8);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffff00, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  effects.push({ mesh, life: 0.3, maxLife: 0.3, type: 'hit' });
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const fx = effects[i];
    fx.life -= dt;
    if (fx.life <= 0) {
      scene.remove(fx.mesh);
      effects.splice(i, 1);
      continue;
    }
    const k = fx.life / fx.maxLife;
    fx.mesh.material.opacity = k * (fx.type === 'smoke' ? 0.7 : 1);

    if (fx.type === 'exp') {
      const s = 1 + (1 - k) * 4;
      fx.mesh.scale.set(s, s, s);
    } else if (fx.type === 'smoke') {
      const s = 1 + (1 - k) * 6;
      fx.mesh.scale.set(s, s, s);
      fx.mesh.position.y += dt * 15;
    }
  }
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
const tmpQuat = new THREE.Quaternion();
const tmpVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 尾焰
  if (flame) {
    const flick = 0.85 + Math.random() * 0.3;
    flame.scale.z = (0.5 + jetState.throttle * 1.5) * flick;
    flame.material.color.setHex(
      jetState.throttle > 0.8 ? 0xff2200 :
      jetState.throttle > 0.5 ? 0xff8800 : 0xffcc44
    );
  }

  // 目标旗帜旋转
  const time = performance.now() * 0.001;
  for (const t of targets) {
    if (!t.alive) continue;
    t.flag.rotation.y = time + t.flagPhase;
  }

  if (state === 'playing') {
    // ============================================================
    // 1. 鼠标位置 → 世界空间目标点
    // ============================================================
    raycaster.setFromCamera(mouseNDC, camera);
    const targetWaypoint = new THREE.Vector3();
    raycaster.ray.at(5000, targetWaypoint);

    // ============================================================
    // 2. 目标点转飞机局部空间
    // ============================================================
    jet.updateMatrixWorld();
    tmpQuat.copy(jet.quaternion).invert();
    const localTarget = targetWaypoint.clone()
      .sub(jet.position)
      .applyQuaternion(tmpQuat)
      .normalize();

    const pitchError = localTarget.y;
    const yawError = -localTarget.x;

    // ============================================================
    // 3. 目标 bank 角
    // ============================================================
    let targetBank = yawError * 3.8;
    targetBank = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, targetBank));

    if (keys['KeyA'] || keys['ArrowLeft']) targetBank = Math.PI / 1.5;
    if (keys['KeyD'] || keys['ArrowRight']) targetBank = -Math.PI / 1.5;

    const localRight = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
    const currentBank = Math.asin(Math.max(-1, Math.min(1, localRight.y)));
    const bankError = targetBank - currentBank;

    // ============================================================
    // 4. 三轴扭矩
    // ============================================================
    const pitchTorque = (pitchError * 18.0) + (Math.abs(currentBank) * 1.5) - (jetState.angularVelocity.x * 4.5);
    const yawTorque = (yawError * 4.0) - (jetState.angularVelocity.y * 5.0);
    const rollTorque = (bankError * 15.0) - (jetState.angularVelocity.z * 3.0);

    jetState.angularVelocity.x += pitchTorque * dt;
    jetState.angularVelocity.y += yawTorque * dt;
    jetState.angularVelocity.z += rollTorque * dt;

    const aeroDamping = 1.0 + (jetState.speed / jetState.maxSpeed) * 1.5;
    jetState.angularVelocity.multiplyScalar(Math.max(0, 1.0 - aeroDamping * dt));

    const maxPitchOmega = 4.5 * 9.8 / Math.max(jetState.speed, 1.0);
    jetState.angularVelocity.x = Math.max(-maxPitchOmega, Math.min(maxPitchOmega, jetState.angularVelocity.x));

    // ============================================================
    // 5. 四元数姿态积分
    // ============================================================
    const w = jetState.angularVelocity;
    const q = jet.quaternion;
    const qSpin = new THREE.Quaternion(w.x * dt * 0.5, w.y * dt * 0.5, w.z * dt * 0.5, 0);
    const qDelta = q.clone().multiply(qSpin);
    q.x += qDelta.x; q.y += qDelta.y; q.z += qDelta.z; q.w += qDelta.w;
    q.normalize();

    // ============================================================
    // 6. 油门
    // ============================================================
    if (keys['KeyW'] || keys['ArrowUp'] || touchThrottleUp) {
      jetState.throttle = Math.min(1, jetState.throttle + dt * 0.5);
    }
    if (keys['KeyS'] || keys['ArrowDown'] || touchThrottleDown) {
      jetState.throttle = Math.max(0, jetState.throttle - dt * 0.5);
    }

    const targetSpeed = jetState.minSpeed + jetState.throttle * (jetState.maxSpeed - jetState.minSpeed);
    jetState.speed += (targetSpeed - jetState.speed) * dt * 1.0;

    // ============================================================
    // 7. 前进
    // ============================================================
    jet.translateZ(-jetState.speed * dt);

    // 高度保护
    if (jet.position.y < 20) {
      jet.position.y = 20;
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(jet.quaternion);
      if (forward.y < 0) {
        const pitchAdjust = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.05, 0, 0, 'YXZ'));
        jet.quaternion.multiply(pitchAdjust);
      }
    }
    if (jet.position.y > 5000) jet.position.y = 5000;

    // 边界
    const lim = GROUND_SIZE / 2 - 500;
    jet.position.x = Math.max(-lim, Math.min(lim, jet.position.x));
    jet.position.z = Math.max(-lim, Math.min(lim, jet.position.z));

    jetState.gForce = 1.0 + Math.abs(jetState.angularVelocity.x * jetState.speed) / 9.8;

    // ============================================================
    // 8. 相机
    // ============================================================
    const camOffset = new THREE.Vector3(0, 15, 55).applyQuaternion(jet.quaternion);
    const camTarget = jet.position.clone().add(camOffset);
    if (camTarget.y < 5) camTarget.y = 5;

    camera.position.lerp(camTarget, dt * 7);

    const lookAhead = jet.position.clone()
      .add(new THREE.Vector3(0, 0, -1).applyQuaternion(jet.quaternion).multiplyScalar(200));
    camera.lookAt(lookAhead);

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
    const camBank = Math.asin(Math.max(-1, Math.min(1, camRight.y)));
    camera.rotateZ(-camBank * 0.5);

    // ============================================================
    // 9. 开火
    // ============================================================
    if ((keys['Space'] || touchFire) && jetState.fireCooldown <= 0) {
      fireCurrentWeapon();
    }
    if (jetState.fireCooldown > 0) jetState.fireCooldown -= dt;
    if (jetState.rocketCooldown > 0) jetState.rocketCooldown -= dt;
    if (jetState.bombCooldown > 0) jetState.bombCooldown -= dt;

    // ============================================================
    // 10. 目标 AI（高射炮开火）
    // ============================================================
    for (const t of targets) {
      if (!t.alive) continue;

      // 炮塔转向飞机
      const toJet = jet.position.clone().sub(t.group.position);
      toJet.y = 0;
      const targetYaw = Math.atan2(toJet.x, toJet.z);
      t.turret.rotation.y += (targetYaw - t.turret.rotation.y) * dt * 2;
      t.barrel.rotation.y = t.turret.rotation.y;

      // AA 炮开火
      if (t.type === 'aa') {
        t.lastFireTime -= dt;
        const dist = jet.position.distanceTo(t.group.position);
        if (t.lastFireTime <= 0 && dist < 2500 && dist > 200) {
          t.lastFireTime = t.fireInterval;
          // 发射一发向飞机的弹丸
          const from = t.group.position.clone();
          from.y = 5;
          const dir = jet.position.clone().sub(from).normalize();

          const bullet = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0xff4400 })
          );
          bullet.position.copy(from);
          scene.add(bullet);

          bullets.push({
            mesh: bullet,
            vel: dir.multiplyScalar(500),
            life: 4,
            damage: 0,
            fromAA: true,
          });
        }
      }
    }

    // ============================================================
    // 11. HUD
    // ============================================================
    const elapsed = (performance.now() - startTime) / 1000;
    document.getElementById('uiTime').textContent = elapsed.toFixed(1);
    document.getElementById('uiSpeed').textContent = Math.round(jetState.speed);
    document.getElementById('uiAlt').textContent = Math.round(jet.position.y);
    document.getElementById('throttleFill').style.height = (jetState.throttle * 100) + '%';
    document.getElementById('throttleText').textContent = Math.round(jetState.throttle * 100) + '%';

    // 鼠标目标圈
    const aimEl = document.getElementById('aimTarget');
    const screenX = (mouseNDC.x * 0.5 + 0.5) * innerWidth;
    const screenY = (-mouseNDC.y * 0.5 + 0.5) * innerHeight;
    aimEl.style.left = screenX + 'px';
    aimEl.style.top = screenY + 'px';

    // 机头对准鼠标
    const dot = new THREE.Vector3(0, 0, -1).applyQuaternion(jet.quaternion)
      .dot(new THREE.Vector3().subVectors(targetWaypoint, jet.position).normalize());
    if (dot > 0.995) aimEl.classList.add('locked');
    else aimEl.classList.remove('locked');

    // 结束
    if (kills >= targets.length) {
      gameOver('全部目标摧毁！');
    }
  }

  updateWeapons(dt);
  updateEffects(dt);

  renderer.render(scene, camera);
}

/* ============================================================
   消息
   ============================================================ */
const msgEl = document.getElementById('msg');
let msgTimer = null;
function showMsg(text, duration = 800) {
  msgEl.textContent = text;
  msgEl.classList.add('show');
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msgEl.classList.remove('show'), duration);
}

/* ============================================================
   开始/结束
   ============================================================ */
const overlay = document.getElementById('overlay');
const ovBtn = document.getElementById('ovBtn');
const ovStats = document.getElementById('ovStats');

function hideOverlay() { overlay.classList.add('hidden'); }
function showOverlay(title, sub, btnText, showStats = false) {
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = title;
  overlay.querySelector('h2').textContent = sub;
  ovBtn.textContent = btnText;
  ovStats.style.display = showStats ? 'flex' : 'none';
  if (showStats) {
    document.getElementById('ovScore').textContent = score;
    document.getElementById('ovKills').textContent = `${kills}/${targets.length}`;
    document.getElementById('ovTime').textContent = ((performance.now() - startTime) / 1000).toFixed(1);
  }
}

function resetGame() {
  kills = 0;
  score = 0;
  jet.position.set(0, 1500, 0);
  jet.quaternion.identity();

  jetState.angularVelocity.set(0, 0, 0);
  jetState.speed = 300;
  jetState.throttle = 0.6;
  jetState.fireCooldown = 0;
  jetState.rocketCooldown = 0;
  jetState.bombCooldown = 0;
  jetState.weapons.cannon.ammo = Infinity;
  jetState.weapons.rocket.ammo = 14;
  jetState.weapons.bomb.ammo = 6;
  jetState.currentWeapon = 'cannon';

  for (const b of bullets) scene.remove(b.mesh);
  bullets.length = 0;
  for (const r of rockets) scene.remove(r.mesh);
  rockets.length = 0;
  for (const b of bombs) scene.remove(b.mesh);
  bombs.length = 0;
  for (const fx of effects) scene.remove(fx.mesh);
  effects.length = 0;

  // 清理旧目标
  for (const t of targets) scene.remove(t.group);
  targets.length = 0;
  spawnGroundTargets();
  updateTargetList();

  document.getElementById('uiKills').textContent = `0/${targets.length}`;
  document.getElementById('uiScore').textContent = '0';
  document.getElementById('uiTime').textContent = '0.0';
  document.getElementById('ammoRocket').textContent = '14';
  document.getElementById('ammoBomb').textContent = '6';

  document.querySelectorAll('.wpn').forEach(el => {
    el.classList.toggle('active', el.dataset.w === 'cannon');
  });

  mouseNDC.x = 0;
  mouseNDC.y = 0;
}

function startGame() {
  resetGame();
  state = 'playing';
  startTime = performance.now();
  hideOverlay();
}

function gameOver(reason) {
  state = 'dead';
  const elapsed = (performance.now() - startTime) / 1000;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('cas_best_score', String(bestScore));
  }

  showOverlay('任务完成', reason, '再来一次', true);

  try {
    const playerName = localStorage.getItem('player_name') || '匿名玩家';
    fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game_key: 'fpv',
        device_id: localStorage.getItem('device_id') || null,
        player_name: playerName,
        score: score,
        wave: kills,
        kills: kills,
        duration: Math.floor(elapsed),
      }),
    }).catch(() => {});
  } catch {}
}

ovBtn.addEventListener('click', startGame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('ctrlToggle').addEventListener('click', toggleCtrlMode);
updateCtrlBtn();
applyCtrlMode();

animate();
</script>
