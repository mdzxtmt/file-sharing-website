<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>空战模拟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#87ceeb;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none;
  }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }

  #topbar {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:20px; padding:10px 22px; border-radius:12px;
    background:rgba(10,16,26,0.6); border:1px solid rgba(90,160,220,0.3);
    backdrop-filter:blur(8px);
  }
  .stat { display:flex; flex-direction:column; align-items:center; min-width:58px; }
  .stat .label { font-size:10px; letter-spacing:2px; color:#6b87a8; margin-bottom:2px; }
  .stat .val { font-size:19px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  #crosshair {
    position:absolute; left:50%; top:50%; width:34px; height:34px;
    transform:translate(-50%,-50%);
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(80,255,120,0.95);
    box-shadow:0 0 6px rgba(0,255,80,0.7);
  }
  #crosshair::before { left:50%; top:0; width:2px; height:34px; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:34px; transform:translateY(-50%); }

  #aimTarget {
    position:absolute; width:56px; height:56px;
    border:2px solid rgba(255,255,255,0.85);
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(0,0,0,0.4);
    transition:border-color 0.15s;
  }
  #aimTarget.locked {
    border-color:rgba(80,255,140,0.95);
    box-shadow:0 0 18px rgba(80,255,140,0.6);
  }

  #throttlePanel {
    position:absolute; left:20px; bottom:20px;
    display:flex; align-items:center; gap:10px;
  }
  #throttleBar {
    width:24px; height:180px;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(120,180,230,0.4);
    border-radius:6px;
    overflow:hidden;
    display:flex; flex-direction:column-reverse;
  }
  #throttleFill {
    width:100%; height:60%;
    background:linear-gradient(180deg,#22d3ee,#3b82f6);
    transition:height 0.08s linear;
  }
  #throttleText {
    color:#cfe8ff; font-size:12px; font-weight:700;
    font-family:monospace; letter-spacing:1px;
    text-shadow:0 0 4px #000;
  }

  #infoPanel {
    position:absolute; right:20px; bottom:20px;
    display:flex; gap:12px;
  }
  #infoPanel > div {
    background:rgba(0,0,0,0.45);
    padding:8px 14px;
    border-radius:8px;
    border:1px solid rgba(120,180,230,0.3);
    text-align:center;
  }
  #infoPanel .label { font-size:10px; color:#6b87a8; letter-spacing:2px; }
  #infoPanel .val { font-size:20px; font-weight:700; color:#a5e8ff; font-variant-numeric:tabular-nums; }

  #msg {
    position:absolute; left:50%; top:32%; transform:translate(-50%,-50%);
    font-size:44px; font-weight:800; letter-spacing:6px;
    color:#fff; text-shadow:0 0 20px rgba(80,200,255,0.9), 0 4px 8px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 0.3s;
  }
  #msg.show { opacity:1; }

  #backBtn {
    position:fixed; top:14px; left:14px; z-index:100;
    padding:8px 16px; border-radius:10px;
    background:rgba(10,16,26,0.7); border:1px solid rgba(90,160,220,0.4);
    color:#cfe8ff; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; text-decoration:none;
    backdrop-filter:blur(8px);
  }
  #backBtn:active { transform:scale(0.95); }

  #ctrlToggle {
    position:fixed; top:14px; left:100px; z-index:100;
    padding:8px 14px; border-radius:10px;
    background:rgba(10,16,26,0.7); border:1px solid rgba(90,160,220,0.4);
    color:#cfe8ff; font-size:12px; font-weight:600;
    cursor:pointer; font-family:inherit;
    backdrop-filter:blur(8px);
  }
  #ctrlToggle:active { transform:scale(0.95); }

  #overlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(10,20,35,0.85), rgba(3,6,12,0.97));
    backdrop-filter:blur(8px);
    color:#dfe8f5;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:42px; letter-spacing:10px; font-weight:800;
    background:linear-gradient(180deg,#d6f6ff,#3fa9e0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #overlay h2 { font-size:13px; letter-spacing:4px; color:#5f7fa3; font-weight:400; }
  #overlay .keys {
    display:grid; grid-template-columns:auto auto; gap:8px 24px;
    font-size:13px; color:#8ba6c4; text-align:left; margin:8px 0;
    background:rgba(255,255,255,0.04);
    padding:14px 22px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #overlay .keys b { color:#cfe8ff; font-weight:600; }
  #ovStats { display:flex; gap:36px; margin:6px 0; }
  #ovStats > div { display:flex; flex-direction:column; gap:2px; }
  #ovStats .v { font-size:24px; font-weight:700; color:#7dd3fc; }
  #ovStats .k { font-size:11px; letter-spacing:2px; color:#5f7fa3; }

  .btn {
    margin-top:6px; padding:13px 50px; font-size:15px;
    letter-spacing:5px; font-weight:700;
    color:#04121c; background:linear-gradient(180deg,#8fe9ff,#28b6e8);
    border:none; border-radius:10px; cursor:pointer;
    box-shadow:0 0 22px rgba(50,190,255,0.45);
    font-family:inherit;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 0 34px rgba(50,190,255,0.7); }

  #touchControls { position:fixed; inset:0; z-index:15; display:none; pointer-events:none; }
  #touchControls.active { display:block; }

  #rotateTip {
    display:none; position:fixed; inset:0; z-index:9999;
    background:#06090f; color:#cfe8ff;
    flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  @media (orientation: portrait) and (max-width:900px) {
    #rotateTip { display:flex; }
  }

  .tbtn {
    position:absolute;
    pointer-events:auto;
    border-radius:50%;
    border:2px solid rgba(120,180,230,0.5);
    background:rgba(18,32,52,0.75);
    color:#cfe8ff;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    touch-action:manipulation;
  }
  .tbtn.pressed { background:rgba(60,140,220,0.9); color:#fff; transform:scale(0.94); }

  #btnThrottleUp { right:24px; bottom:180px; width:80px; height:80px; font-size:26px; }
  #btnThrottleDown { right:24px; bottom:20px; width:80px; height:80px; font-size:26px; }
  #btnFire { right:120px; bottom:20px; width:90px; height:90px; font-size:13px;
    background:rgba(80,20,20,0.75); border-color:rgba(255,100,80,0.6); color:#ffd0c8; }
</style>
</head>
<body>

<a id="backBtn" href="/games">← 返回</a>
<button id="ctrlToggle">控制: 键鼠</button>

<div id="rotateTip">
  <div style="font-size:56px;">📱</div>
  <div style="font-size:15px;letter-spacing:2px;">请横屏使用</div>
</div>

<div id="hud">
  <div id="topbar">
    <div class="stat"><span class="label">TARGETS</span><span class="val" id="uiKills">0</span></div>
    <div class="stat"><span class="label">TIME</span><span class="val" id="uiTime">0.0</span></div>
    <div class="stat"><span class="label">BEST</span><span class="val" id="uiBest">0</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="aimTarget"></div>

  <div id="throttlePanel">
    <div id="throttleBar"><div id="throttleFill"></div></div>
    <div id="throttleText">60%</div>
  </div>

  <div id="infoPanel">
    <div>
      <div class="label">SPD</div>
      <div class="val"><span id="uiSpeed">300</span></div>
    </div>
    <div>
      <div class="label">ALT</div>
      <div class="val"><span id="uiAlt">500</span></div>
    </div>
  </div>

  <div id="msg"></div>
</div>

<div id="touchControls">
  <div class="tbtn" id="btnThrottleUp">▲</div>
  <div class="tbtn" id="btnThrottleDown">▼</div>
  <div class="tbtn" id="btnFire">开火</div>
</div>

<div id="overlay">
  <h1>空战模拟</h1>
  <h2>击落所有目标，成为王牌飞行员</h2>
  <div id="ovStats" style="display:none">
    <div><span class="v" id="ovKills">0</span><span class="k">TARGETS</span></div>
    <div><span class="v" id="ovTime">0.0</span><span class="k">TIME</span></div>
  </div>
  <div class="keys">
    <b>鼠标移动</b><span>控制瞄准方向</span>
    <b>W / S</b><span>加/减油门</span>
    <b>A / D</b><span>左右滚转</span>
    <b>空格</b><span>开火</span>
    <b>ESC</b><span>暂停</span>
  </div>
  <button class="btn" id="ovBtn">起飞</button>
</div>

<script type="module">
import * as THREE from '/three.module.js';

/* ============================================================
   控制模式（纯手动切换）
   ============================================================ */
let controlMode = (() => {
  try {
    const saved = localStorage.getItem('jet_control');
    if (saved === 'touch' || saved === 'keyboard') return saved;
  } catch {}
  return 'keyboard';
})();

let isTouch = controlMode === 'touch';

function updateCtrlBtn() {
  const el = document.getElementById('ctrlToggle');
  if (!el) return;
  el.textContent = '控制: ' + (isTouch ? '触屏' : '键鼠');
}

function toggleCtrlMode() {
  controlMode = isTouch ? 'keyboard' : 'touch';
  isTouch = controlMode === 'touch';
  try { localStorage.setItem('jet_control', controlMode); } catch {}
  updateCtrlBtn();
  applyCtrlMode();
}

function applyCtrlMode() {
  const tc = document.getElementById('touchControls');
  if (!tc) return;
  if (isTouch) tc.classList.add('active');
  else tc.classList.remove('active');
}

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 800, 3000);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 8000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 0.85));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.3);
sun.position.set(500, 800, 400);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -500;
sun.shadow.camera.far = 2000;
scene.add(sun);

/* 天空穹顶 */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2;
skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
skyGrad.addColorStop(0, '#1a5ba8');
skyGrad.addColorStop(0.5, '#6ca6cd');
skyGrad.addColorStop(1, '#aaccff');
skyCtx.fillStyle = skyGrad;
skyCtx.fillRect(0, 0, 2, 512);
const skydome = new THREE.Mesh(
  new THREE.SphereGeometry(6000, 32, 16),
  new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(skyCanvas),
    side: THREE.BackSide,
    fog: false,
  })
);
scene.add(skydome);

/* 地面 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20000, 20000, 100, 100),
  new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
const gPos = ground.geometry.attributes.position;
for (let i = 0; i < gPos.count; i++) {
  const x = gPos.getX(i);
  const y = gPos.getY(i);
  const h = Math.sin(x * 0.0008) * Math.cos(y * 0.0008) * 80
          + Math.sin(x * 0.002 + 1.2) * 30;
  gPos.setZ(i, h);
}
ground.geometry.computeVertexNormals();
ground.position.y = -200;
scene.add(ground);

const grid = new THREE.GridHelper(20000, 200, 0x3a6b2a, 0x3a6b2a);
grid.position.y = -199;
grid.material.opacity = 0.15;
grid.material.transparent = true;
scene.add(grid);

/* 云层 */
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudMat = new THREE.MeshLambertMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.75,
});

for (let i = 0; i < 60; i++) {
  const cloudCluster = new THREE.Group();
  const blocks = 4 + Math.floor(Math.random() * 4);
  for (let j = 0; j < blocks; j++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cloudMat);
    c.scale.set(
      200 + Math.random() * 400,
      60 + Math.random() * 100,
      200 + Math.random() * 400
    );
    c.position.set(
      (Math.random() - 0.5) * 600,
      (Math.random() - 0.5) * 80,
      (Math.random() - 0.5) * 600
    );
    cloudCluster.add(c);
  }
  cloudCluster.position.set(
    (Math.random() - 0.5) * 10000,
    400 + Math.random() * 800,
    (Math.random() - 0.5) * 10000
  );
  cloudGroup.add(cloudCluster);
}

/* ============================================================
   战机模型
   ============================================================ */
const jet = new THREE.Group();
scene.add(jet);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5a6b7a, roughness: 0.5, metalness: 0.7 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.6, metalness: 0.5 });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x88ccff, transparent: true, opacity: 0.4,
  roughness: 0.1, metalness: 0.9,
  emissive: 0x224466, emissiveIntensity: 0.3,
});
const engineMat = new THREE.MeshBasicMaterial({ color: 0xff8800 });

const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.7, 8, 12), bodyMat);
fuselage.rotation.x = Math.PI / 2;
fuselage.castShadow = true;
jet.add(fuselage);

const noseCone = new THREE.Mesh(
  new THREE.ConeGeometry(0.9, 3, 12).rotateX(-Math.PI / 2),
  darkMat
);
noseCone.position.set(0, 0, -5.5);
noseCone.castShadow = true;
jet.add(noseCone);

const canopy = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  glassMat
);
canopy.scale.set(1, 1.3, 2.8);
canopy.position.set(0, 0.7, -2.2);
jet.add(canopy);

const wingShape = new THREE.Shape();
wingShape.moveTo(0, 1.5);
wingShape.lineTo(5, -1);
wingShape.lineTo(5, -1.8);
wingShape.lineTo(0, -2);
wingShape.lineTo(0, 1.5);
const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
  depth: 0.15, bevelEnabled: false,
}).rotateX(Math.PI / 2);

const rightWing = new THREE.Mesh(wingGeo, bodyMat);
rightWing.position.set(0.7, -0.1, -0.5);
rightWing.castShadow = true;
jet.add(rightWing);

const leftWing = new THREE.Mesh(wingGeo, bodyMat);
leftWing.scale.x = -1;
leftWing.position.set(-0.7, -0.1, -0.5);
leftWing.castShadow = true;
jet.add(leftWing);

const vTailShape = new THREE.Shape();
vTailShape.moveTo(0, 0);
vTailShape.lineTo(0.3, 2);
vTailShape.lineTo(0.8, 2);
vTailShape.lineTo(0.6, 0.3);
vTailShape.lineTo(0, 0);
const vTail = new THREE.Mesh(
  new THREE.ExtrudeGeometry(vTailShape, { depth: 0.12, bevelEnabled: false }),
  bodyMat
);
vTail.position.set(-0.06, 0.6, 2.8);
vTail.castShadow = true;
jet.add(vTail);

const hTailGeo = new THREE.BoxGeometry(1.8, 0.12, 1);
for (const side of [-1, 1]) {
  const hTail = new THREE.Mesh(hTailGeo, bodyMat);
  hTail.position.set(side * 1.3, 0, 3.2);
  hTail.castShadow = true;
  jet.add(hTail);
}

const engine = new THREE.Mesh(
  new THREE.CylinderGeometry(0.75, 0.85, 1, 12).rotateX(Math.PI / 2),
  darkMat
);
engine.position.set(0, 0, 4.3);
jet.add(engine);

const flame = new THREE.Mesh(
  new THREE.ConeGeometry(0.55, 2.5, 8).rotateX(Math.PI / 2),
  engineMat
);
flame.position.set(0, 0, 5.8);
jet.add(flame);

jet.position.set(0, 500, 0);

/* ============================================================
   目标
   ============================================================ */
const targets = [];
const targetMat = new THREE.MeshStandardMaterial({
  color: 0xff3333, emissive: 0xaa0000, emissiveIntensity: 0.5,
  roughness: 0.4, metalness: 0.3,
});

const TARGET_COUNT = 10;
function spawnTargets() {
  for (let i = 0; i < targets.length; i++) {
    scene.remove(targets[i].group);
  }
  targets.length = 0;

  for (let i = 0; i < TARGET_COUNT; i++) {
    const g = new THREE.Group();
    const balloon = new THREE.Mesh(new THREE.SphereGeometry(20, 16, 12), targetMat);
    balloon.castShadow = true;
    g.add(balloon);

    const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const bar1 = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 2), barMat);
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(2, 50, 2), barMat);
    g.add(bar1);
    g.add(bar2);

    g.position.set(
      (Math.random() - 0.5) * 6000,
      400 + Math.random() * 1200,
      -1000 - Math.random() * 6000
    );

    scene.add(g);

    targets.push({
      group: g,
      alive: true,
      hp: 3,
      vel: new THREE.Vector3(0, 0, 0),
      wanderTimer: 0,
    });
  }
}
spawnTargets();

/* ============================================================
   状态
   ============================================================ */
let state = 'menu';
let kills = 0;
let startTime = 0;
let bestKills = parseInt(localStorage.getItem('jet_best_kills') || '0', 10);

const jetState = {
  yaw: 0,
  pitch: 0,
  roll: 0,
  yawVel: 0,
  pitchVel: 0,
  speed: 300,
  throttle: 0.6,
  maxSpeed: 500,
  minSpeed: 180,
  fireCooldown: 0,
};

const keys = {};

/* ============================================================
   输入
   ============================================================ */
let pointerX = innerWidth / 2;
let pointerY = innerHeight / 2;

document.addEventListener('mousemove', (e) => {
  if (isTouch) return;
  pointerX = e.clientX;
  pointerY = e.clientY;
});

// 触摸拖动
let touchLookId = null;
document.addEventListener('touchstart', (e) => {
  if (!isTouch || state !== 'playing') return;
  const t = e.changedTouches[0];
  if (t.target.closest && t.target.closest('.tbtn')) return;
  if (t.target.id === 'backBtn' || t.target.id === 'ctrlToggle') return;
  if (touchLookId === null) {
    touchLookId = t.identifier;
    pointerX = t.clientX;
    pointerY = t.clientY;
  }
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (!isTouch || state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) {
      pointerX = t.clientX;
      pointerY = t.clientY;
      e.preventDefault();
    }
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) touchLookId = null;
  }
});

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape') {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('已暂停', '按 ESC 继续', '继续飞行', false);
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

function bindHold(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); el.classList.add('pressed'); onDown(); }, { passive: false });
  el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp && onUp(); }, { passive: false });
  el.addEventListener('touchcancel', () => { el.classList.remove('pressed'); onUp && onUp(); });
}
let touchThrottleUp = false, touchThrottleDown = false, touchFire = false;
bindHold('btnThrottleUp', () => { touchThrottleUp = true; }, () => { touchThrottleUp = false; });
bindHold('btnThrottleDown', () => { touchThrottleDown = true; }, () => { touchThrottleDown = false; });
bindHold('btnFire', () => { touchFire = true; }, () => { touchFire = false; });

/* ============================================================
   子弹
   ============================================================ */
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(1, 6, 6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

function fireBullet() {
  if (jetState.fireCooldown > 0) return;
  jetState.fireCooldown = 0.08;

  const dir = new THREE.Vector3(0, 0, -1).applyEuler(
    new THREE.Euler(jetState.pitch, jetState.yaw, 0, 'YXZ')
  );

  const spawnPos = jet.position.clone().add(dir.clone().multiplyScalar(6));

  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(spawnPos);
  scene.add(b);

  bullets.push({
    mesh: b,
    vel: dir.multiplyScalar(900),
    life: 2.5,
  });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.mesh.position.addScaledVector(b.vel, dt);

    let dead = b.life <= 0;

    if (!dead) {
      for (const t of targets) {
        if (!t.alive) continue;
        const d = b.mesh.position.distanceTo(t.group.position);
        if (d < 25) {
          t.hp--;
          spawnHitEffect(t.group.position);
          if (t.hp <= 0) {
            t.alive = false;
            scene.remove(t.group);
            kills++;
            document.getElementById('uiKills').textContent = kills;
            showMsg('目标摧毁！', 800);
            spawnExplosion(t.group.position);
          } else {
            showMsg('命中！', 400);
          }
          dead = true;
          break;
        }
      }
    }

    if (dead) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }
}

/* ============================================================
   特效
   ============================================================ */
const effects = [];
function spawnExplosion(pos) {
  const geo = new THREE.SphereGeometry(30, 12, 12);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff8800, transparent: true, opacity: 1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  effects.push({ mesh, life: 1.2, maxLife: 1.2, type: 'exp' });
}
function spawnHitEffect(pos) {
  const geo = new THREE.SphereGeometry(10, 8, 8);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffff00, transparent: true, opacity: 1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  effects.push({ mesh, life: 0.3, maxLife: 0.3, type: 'hit' });
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const fx = effects[i];
    fx.life -= dt;
    if (fx.life <= 0) {
      scene.remove(fx.mesh);
      effects.splice(i, 1);
      continue;
    }
    const k = fx.life / fx.maxLife;
    fx.mesh.material.opacity = k;
    if (fx.type === 'exp') {
      const s = 1 + (1 - k) * 4;
      fx.mesh.scale.set(s, s, s);
    }
  }
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
const MAX_YAW_VEL = 1.2;
const MAX_PITCH_VEL = 1.0;
const DEADZONE = 0.12;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (flame) {
    const flick = 0.85 + Math.random() * 0.3;
    flame.scale.z = (0.5 + jetState.throttle * 1.5) * flick;
    flame.material.color.setHex(
      jetState.throttle > 0.8 ? 0xff2200 :
      jetState.throttle > 0.5 ? 0xff8800 : 0xffcc44
    );
  }

  if (state === 'playing') {
    let mx = (pointerX / innerWidth) * 2 - 1;
    let my = (pointerY / innerHeight) * 2 - 1;

    if (Math.abs(mx) < DEADZONE) mx = 0;
    else mx = (mx - Math.sign(mx) * DEADZONE) / (1 - DEADZONE);

    if (Math.abs(my) < DEADZONE) my = 0;
    else my = (my - Math.sign(my) * DEADZONE) / (1 - DEADZONE);

    const targetYawVel = -mx * MAX_YAW_VEL;
    const targetPitchVel = -my * MAX_PITCH_VEL;

    jetState.yawVel += (targetYawVel - jetState.yawVel) * dt * 4;
    jetState.pitchVel += (targetPitchVel - jetState.pitchVel) * dt * 4;

    jetState.yaw += jetState.yawVel * dt;
    jetState.pitch += jetState.pitchVel * dt;

    jetState.pitch = Math.max(-1.4, Math.min(1.4, jetState.pitch));

    const targetRoll = -mx * 1.0;
    jetState.roll += (targetRoll - jetState.roll) * dt * 4;

    if (keys['KeyA'] || keys['ArrowLeft']) {
      jetState.roll -= dt * 3;
      jetState.yawVel -= dt * 2;
    }
    if (keys['KeyD'] || keys['ArrowRight']) {
      jetState.roll += dt * 3;
      jetState.yawVel += dt * 2;
    }

    if (keys['KeyW'] || keys['ArrowUp'] || touchThrottleUp) {
      jetState.throttle = Math.min(1, jetState.throttle + dt * 0.5);
    }
    if (keys['KeyS'] || keys['ArrowDown'] || touchThrottleDown) {
      jetState.throttle = Math.max(0, jetState.throttle - dt * 0.5);
    }

    const targetSpeed = jetState.minSpeed + jetState.throttle * (jetState.maxSpeed - jetState.minSpeed);
    jetState.speed += (targetSpeed - jetState.speed) * dt * 1.0;

    const euler = new THREE.Euler(jetState.pitch, jetState.yaw, 0, 'YXZ');
    const dir = new THREE.Vector3(0, 0, -1).applyEuler(euler);
    jet.position.addScaledVector(dir, jetState.speed * dt);

    if (jet.position.y < 30) { jet.position.y = 30; jetState.pitch = Math.max(0, jetState.pitch); }
    if (jet.position.y > 3000) { jet.position.y = 3000; jetState.pitch = Math.min(0, jetState.pitch); }

    jet.rotation.order = 'YXZ';
    jet.rotation.y = jetState.yaw;
    jet.rotation.x = jetState.pitch;
    jet.rotation.z = jetState.roll;

    const camBack = new THREE.Vector3(0, 8, 35).applyEuler(
      new THREE.Euler(jetState.pitch * 0.7, jetState.yaw, 0, 'YXZ')
    );
    const camTarget = jet.position.clone().add(camBack);

    if (camTarget.y < 5) camTarget.y = 5;

    camera.position.lerp(camTarget, dt * 4);

    const lookDir = new THREE.Vector3(0, 0, -1).applyEuler(
      new THREE.Euler(jetState.pitch, jetState.yaw, 0, 'YXZ')
    );
    const lookPoint = jet.position.clone().addScaledVector(lookDir, 50);
    camera.lookAt(lookPoint);

    camera.rotation.z = jetState.roll * 0.2;

    if ((keys['Space'] || touchFire) && jetState.fireCooldown <= 0) {
      fireBullet();
    }
    if (jetState.fireCooldown > 0) jetState.fireCooldown -= dt;

    for (const t of targets) {
      if (!t.alive) continue;
      t.wanderTimer -= dt;
      if (t.wanderTimer <= 0) {
        t.wanderTimer = 2 + Math.random() * 3;
        t.vel.set(
          (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 30
        );
      }
      t.group.position.addScaledVector(t.vel, dt);
      t.group.rotation.y += dt * 0.5;
    }

    const elapsed = (performance.now() - startTime) / 1000;
    document.getElementById('uiTime').textContent = elapsed.toFixed(1);
    document.getElementById('uiSpeed').textContent = Math.round(jetState.speed);
    document.getElementById('uiAlt').textContent = Math.round(jet.position.y);
    document.getElementById('throttleFill').style.height = (jetState.throttle * 100) + '%';
    document.getElementById('throttleText').textContent = Math.round(jetState.throttle * 100) + '%';

    const aimEl = document.getElementById('aimTarget');
    aimEl.style.left = pointerX + 'px';
    aimEl.style.top = pointerY + 'px';
    const d = Math.hypot(pointerX - innerWidth / 2, pointerY - innerHeight / 2);
    if (d < 40) aimEl.classList.add('locked');
    else aimEl.classList.remove('locked');

    if (kills >= TARGET_COUNT) {
      gameOver('全部击落！');
    }
  }

  updateBullets(dt);
  updateEffects(dt);

  renderer.render(scene, camera);
}

/* ============================================================
   消息
   ============================================================ */
const msgEl = document.getElementById('msg');
let msgTimer = null;
function showMsg(text, duration = 800) {
  msgEl.textContent = text;
  msgEl.classList.add('show');
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msgEl.classList.remove('show'), duration);
}

/* ============================================================
   开始/结束
   ============================================================ */
const overlay = document.getElementById('overlay');
const ovBtn = document.getElementById('ovBtn');
const ovStats = document.getElementById('ovStats');

function hideOverlay() { overlay.classList.add('hidden'); }
function showOverlay(title, sub, btnText, showStats = false) {
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = title;
  overlay.querySelector('h2').textContent = sub;
  ovBtn.textContent = btnText;
  ovStats.style.display = showStats ? 'flex' : 'none';
  if (showStats) {
    document.getElementById('ovKills').textContent = kills;
    document.getElementById('ovTime').textContent = ((performance.now() - startTime) / 1000).toFixed(1);
  }
}

function resetGame() {
  kills = 0;
  jet.position.set(0, 500, 0);
  jetState.yaw = 0;
  jetState.pitch = 0;
  jetState.roll = 0;
  jetState.yawVel = 0;
  jetState.pitchVel = 0;
  jetState.speed = 300;
  jetState.throttle = 0.6;
  jetState.fireCooldown = 0;

  for (const b of bullets) scene.remove(b.mesh);
  bullets.length = 0;
  for (const fx of effects) scene.remove(fx.mesh);
  effects.length = 0;

  spawnTargets();

  document.getElementById('uiKills').textContent = '0';
  document.getElementById('uiTime').textContent = '0.0';
  document.getElementById('uiBest').textContent = bestKills;

  pointerX = innerWidth / 2;
  pointerY = innerHeight / 2;
}

function startGame() {
  resetGame();
  state = 'playing';
  startTime = performance.now();
  hideOverlay();
}

function gameOver(reason) {
  state = 'dead';
  const elapsed = (performance.now() - startTime) / 1000;

  if (kills > bestKills) {
    bestKills = kills;
    localStorage.setItem('jet_best_kills', String(bestKills));
    document.getElementById('uiBest').textContent = bestKills;
  }

  showOverlay('任务结束', reason, '再来一次', true);

  try {
    const playerName = localStorage.getItem('player_name') || '匿名玩家';
    const score = kills * 300 + Math.max(0, Math.floor(5000 - elapsed * 20));
    fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game_key: 'fpv',
        device_id: localStorage.getItem('device_id') || null,
        player_name: playerName,
        score: score,
        wave: kills,
        kills: kills,
        duration: Math.floor(elapsed),
      }),
    }).catch(() => {});
  } catch {}
}

ovBtn.addEventListener('click', startGame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('uiBest').textContent = bestKills;

// ===== 初始化 =====
document.getElementById('ctrlToggle').addEventListener('click', toggleCtrlMode);
updateCtrlBtn();
applyCtrlMode();

animate();
</script>
