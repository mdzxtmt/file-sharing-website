name: Automatic Rollback

on:
  workflow_dispatch:
    inputs:
      rollback_type:
        description: 'Type of rollback to perform'
        required: true
        default: 'deployment'
        type: choice
        options:
        - deployment
        - database
        - configuration
        - full
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      target_deployment:
        description: 'Target deployment URL (for deployment rollback)'
        required: false
        type: string
      target_migration:
        description: 'Target migration version (for database rollback)'
        required: false
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

env:
  NODE_VERSION: '18'

jobs:
  # 回滚前验证
  pre-rollback-validation:
    name: Pre-Rollback Validation
    runs-on: ubuntu-latest
    
    outputs:
      can_proceed: ${{ steps.validation.outputs.can_proceed }}
      target_deployment: ${{ steps.validation.outputs.target_deployment }}
      target_migration: ${{ steps.validation.outputs.target_migration }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate rollback parameters
        id: validation
        run: |
          echo "🔍 验证回滚参数..."
          
          rollback_type="${{ github.event.inputs.rollback_type }}"
          environment="${{ github.event.inputs.environment }}"
          
          # 验证环境
          if [[ "$environment" != "production" && "$environment" != "staging" ]]; then
            echo "❌ 无效的环境: $environment"
            exit 1
          fi
          
          # 验证回滚类型特定参数
          case "$rollback_type" in
            "deployment")
              if [[ -z "${{ github.event.inputs.target_deployment }}" ]]; then
                echo "⚠️ 未指定目标部署，将使用最后一个稳定部署"
                echo "target_deployment=auto" >> $GITHUB_OUTPUT
              else
                echo "target_deployment=${{ github.event.inputs.target_deployment }}" >> $GITHUB_OUTPUT
              fi
              ;;
            "database")
              if [[ -z "${{ github.event.inputs.target_migration }}" ]]; then
                echo "❌ 数据库回滚需要指定目标迁移版本"
                exit 1
              fi
              echo "target_migration=${{ github.event.inputs.target_migration }}" >> $GITHUB_OUTPUT
              ;;
            "full")
              if [[ -z "${{ github.event.inputs.target_deployment }}" || -z "${{ github.event.inputs.target_migration }}" ]]; then
                echo "❌ 完整回滚需要指定目标部署和迁移版本"
                exit 1
              fi
              echo "target_deployment=${{ github.event.inputs.target_deployment }}" >> $GITHUB_OUTPUT
              echo "target_migration=${{ github.event.inputs.target_migration }}" >> $GITHUB_OUTPUT
              ;;
          esac
          
          echo "can_proceed=true" >> $GITHUB_OUTPUT
          echo "✅ 回滚参数验证通过"
          
      - name: Check current system status
        run: |
          echo "🔍 检查当前系统状态..."
          
          # 设置环境URL
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            url="${{ secrets.PRODUCTION_URL || 'https://your-domain.com' }}"
          else
            url="${{ secrets.STAGING_URL || 'https://your-staging.vercel.app' }}"
          fi
          
          echo "检查环境: ${{ github.event.inputs.environment }}"
          echo "目标URL: $url"
          
          # 运行健康检查
          node scripts/health-check.js "$url" || echo "⚠️ 当前系统状态异常，回滚可能是必要的"

  # 执行回滚
  execute-rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    needs: pre-rollback-validation
    if: needs.pre-rollback-validation.outputs.can_proceed == 'true'
    
    environment:
      name: ${{ github.event.inputs.environment }}-rollback
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Execute rollback
        id: rollback
        run: |
          echo "🔄 开始执行回滚..."
          echo "类型: ${{ github.event.inputs.rollback_type }}"
          echo "环境: ${{ github.event.inputs.environment }}"
          echo "原因: ${{ github.event.inputs.reason }}"
          
          # 设置环境变量
          export AUTO_ROLLBACK_ENABLED=true
          
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            export VERCEL_TOKEN="${{ secrets.VERCEL_TOKEN }}"
            export NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          else
            export VERCEL_TOKEN="${{ secrets.VERCEL_TOKEN }}"
            export NEXT_PUBLIC_SUPABASE_URL="${{ secrets.STAGING_SUPABASE_URL }}"
            export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}"
          fi
          
          # 执行回滚
          case "${{ github.event.inputs.rollback_type }}" in
            "deployment")
              if [[ "${{ needs.pre-rollback-validation.outputs.target_deployment }}" == "auto" ]]; then
                node scripts/rollback-manager.js deployment auto ${{ github.event.inputs.environment }}
              else
                node scripts/rollback-manager.js deployment "${{ needs.pre-rollback-validation.outputs.target_deployment }}" ${{ github.event.inputs.environment }}
              fi
              ;;
            "database")
              node scripts/rollback-manager.js database "${{ needs.pre-rollback-validation.outputs.target_migration }}"
              ;;
            "configuration")
              echo "配置回滚功能开发中..."
              ;;
            "full")
              echo "执行完整回滚..."
              # 先执行数据库回滚
              node scripts/rollback-manager.js database "${{ needs.pre-rollback-validation.outputs.target_migration }}"
              # 再执行部署回滚
              node scripts/rollback-manager.js deployment "${{ needs.pre-rollback-validation.outputs.target_deployment }}" ${{ github.event.inputs.environment }}
              ;;
          esac
          
          echo "rollback_completed=true" >> $GITHUB_OUTPUT
          
      - name: Verify rollback success
        if: steps.rollback.outputs.rollback_completed == 'true'
        run: |
          echo "🔍 验证回滚结果..."
          
          # 等待回滚生效
          sleep 60
          
          # 设置环境URL
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            url="${{ secrets.PRODUCTION_URL || 'https://your-domain.com' }}"
          else
            url="${{ secrets.STAGING_URL || 'https://your-staging.vercel.app' }}"
          fi
          
          # 运行健康检查验证回滚结果
          if node scripts/health-check.js "$url"; then
            echo "✅ 回滚后系统健康检查通过"
          else
            echo "❌ 回滚后系统健康检查失败"
            exit 1
          fi
          
      - name: Create rollback summary
        if: always()
        run: |
          echo "## 🔄 Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.rollback.outcome }}" == "success" ]]; then
            echo "✅ **Rollback Status**: Completed Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Rollback Status**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Rollback Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.rollback_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.rollback_type }}" == "deployment" || "${{ github.event.inputs.rollback_type }}" == "full" ]]; then
            echo "- **Target Deployment**: ${{ needs.pre-rollback-validation.outputs.target_deployment }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.rollback_type }}" == "database" || "${{ github.event.inputs.rollback_type }}" == "full" ]]; then
            echo "- **Target Migration**: ${{ needs.pre-rollback-validation.outputs.target_migration }}" >> $GITHUB_STEP_SUMMARY
          fi

  # 回滚后监控
  post-rollback-monitoring:
    name: Post-Rollback Monitoring
    runs-on: ubuntu-latest
    needs: [pre-rollback-validation, execute-rollback]
    if: always() && needs.execute-rollback.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Extended monitoring
        run: |
          echo "📊 开始回滚后扩展监控..."
          
          # 设置环境URL
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            url="${{ secrets.PRODUCTION_URL || 'https://your-domain.com' }}"
          else
            url="${{ secrets.STAGING_URL || 'https://your-staging.vercel.app' }}"
          fi
          
          # 连续监控30分钟
          for i in {1..6}; do
            echo "监控轮次 $i/6..."
            
            if node scripts/health-check.js "$url"; then
              echo "✅ 第 $i 轮健康检查通过"
            else
              echo "❌ 第 $i 轮健康检查失败"
              
              # 发送告警通知
              if [[ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
                curl -X POST -H 'Content-type: application/json' \
                  --data "{
                    \"text\": \"🚨 回滚后监控告警\",
                    \"attachments\": [{
                      \"color\": \"danger\",
                      \"fields\": [
                        {\"title\": \"环境\", \"value\": \"${{ github.event.inputs.environment }}\", \"short\": true},
                        {\"title\": \"监控轮次\", \"value\": \"$i/6\", \"short\": true},
                        {\"title\": \"状态\", \"value\": \"健康检查失败\", \"short\": true}
                      ]
                    }]
                  }" \
                  "${{ secrets.SLACK_WEBHOOK_URL }}"
              fi
            fi
            
            # 等待5分钟
            if [[ $i -lt 6 ]]; then
              sleep 300
            fi
          done
          
          echo "✅ 回滚后监控完成"
          
      - name: Generate monitoring report
        run: |
          echo "## 📊 Post-Rollback Monitoring Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Extended Monitoring**: Completed 30-minute monitoring cycle" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Monitoring Duration**: 30 minutes (6 cycles)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- 继续监控系统稳定性" >> $GITHUB_STEP_SUMMARY
          echo "- 分析回滚原因并制定预防措施" >> $GITHUB_STEP_SUMMARY
          echo "- 更新部署流程以避免类似问题" >> $GITHUB_STEP_SUMMARY
