name: Environment Security Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.env*'
      - 'scripts/env-manager.js'
      - 'scripts/check-services.js'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.env*'
      - 'scripts/env-manager.js'
      - 'scripts/check-services.js'
  schedule:
    # 每周一早上8点运行安全检查
    - cron: '0 8 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # 环境变量安全扫描
  security-scan:
    name: Environment Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Scan for sensitive data leaks
        run: |
          echo "🔍 扫描敏感数据泄露..."
          
          # 检查是否有真实密钥被意外提交
          sensitive_patterns=(
            "eyJ[A-Za-z0-9_-]{10,}"  # JWT tokens
            "sk_[a-zA-Z0-9]{20,}"    # Stripe keys
            "pk_[a-zA-Z0-9]{20,}"    # Public keys
            "[0-9a-f]{32}"           # MD5 hashes
            "[0-9a-f]{40}"           # SHA1 hashes
            "[0-9a-f]{64}"           # SHA256 hashes
          )
          
          found_issues=false
          
          for pattern in "${sensitive_patterns[@]}"; do
            if grep -r -E "$pattern" .env* 2>/dev/null | grep -v "your_" | grep -v "example"; then
              echo "⚠️ 发现可能的敏感数据: $pattern"
              found_issues=true
            fi
          done
          
          if [ "$found_issues" = true ]; then
            echo "❌ 发现敏感数据泄露风险"
            exit 1
          else
            echo "✅ 未发现敏感数据泄露"
          fi
          
      - name: Check environment file security
        run: |
          echo "🔒 检查环境文件安全性..."
          
          # 检查.env文件是否被意外提交
          if git ls-files | grep -E "^\.env$|^\.env\.local$"; then
            echo "❌ 发现.env文件被提交到版本控制"
            echo "请立即从版本控制中移除这些文件"
            exit 1
          fi
          
          # 检查.gitignore配置
          if ! grep -q "\.env" .gitignore; then
            echo "⚠️ .gitignore中未配置.env文件忽略规则"
            echo "建议添加: .env*"
          fi
          
          echo "✅ 环境文件安全检查通过"
          
      - name: Validate environment configurations
        run: |
          echo "🔧 验证环境配置..."
          npm run env:validate
          
      - name: Check for default/example values
        run: |
          echo "🔍 检查默认值和示例值..."
          
          # 检查是否使用了默认的不安全值
          default_values=(
            "your_supabase_url"
            "your_supabase_anon_key"
            "your_service_role_key"
            "example.com"
            "localhost:3000"
            "test_key"
            "demo_key"
          )
          
          found_defaults=false
          
          for value in "${default_values[@]}"; do
            if grep -r "$value" .env* 2>/dev/null; then
              echo "⚠️ 发现默认值: $value"
              found_defaults=true
            fi
          done
          
          if [ "$found_defaults" = true ]; then
            echo "ℹ️ 发现默认值，这在模板文件中是正常的"
          else
            echo "✅ 未发现不安全的默认值"
          fi

  # 配置完整性检查
  config-integrity:
    name: Configuration Integrity Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check environment file consistency
        run: |
          echo "🔍 检查环境文件一致性..."
          
          # 检查所有环境文件是否存在
          env_files=(".env.staging" ".env.production")
          
          for file in "${env_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file 存在"
              
              # 检查必需变量是否都有定义
              required_vars=(
                "NEXT_PUBLIC_SUPABASE_URL"
                "NEXT_PUBLIC_SUPABASE_ANON_KEY"
                "NEXT_PUBLIC_SITE_URL"
              )
              
              for var in "${required_vars[@]}"; do
                if grep -q "^$var=" "$file"; then
                  echo "  ✅ $var 已定义"
                else
                  echo "  ❌ $var 未定义"
                fi
              done
            else
              echo "⚠️ $file 不存在"
            fi
          done
          
      - name: Validate CI environment variables
        run: |
          echo "🔍 验证CI环境变量配置..."
          
          # 模拟CI环境
          export CI=true
          export GITHUB_REF=refs/heads/main
          
          # 运行环境检查
          npm run ci:env-check
          
      - name: Test environment manager
        run: |
          echo "🧪 测试环境管理器..."
          
          # 测试生成模板功能
          npm run env:generate development -- --force
          
          # 验证生成的模板
          if [ -f ".env.local" ]; then
            echo "✅ 环境模板生成成功"
            
            # 检查模板内容
            if grep -q "your_.*_here" .env.local; then
              echo "✅ 模板包含正确的占位符"
            else
              echo "❌ 模板格式不正确"
              exit 1
            fi
          else
            echo "❌ 环境模板生成失败"
            exit 1
          fi

  # 安全报告生成
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, config-integrity]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "## 🔐 Environment Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Security Scan Status
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ **Security Scan**: No issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security Scan**: Issues detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Config Integrity Status
          if [ "${{ needs.config-integrity.result }}" == "success" ]; then
            echo "✅ **Configuration Integrity**: All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Configuration Integrity**: Issues found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Security Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 定期轮换API密钥和令牌" >> $GITHUB_STEP_SUMMARY
          echo "- 确保.env文件不被提交到版本控制" >> $GITHUB_STEP_SUMMARY
          echo "- 使用GitHub Secrets管理敏感信息" >> $GITHUB_STEP_SUMMARY
          echo "- 定期审查环境变量配置" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.config-integrity.result }}" == "success" ]; then
            echo "- ✅ 环境配置安全，可以继续部署" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 请修复安全问题后再进行部署" >> $GITHUB_STEP_SUMMARY
            echo "- 📖 查看详细日志了解具体问题" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Environment security check completed at $(date)*" >> $GITHUB_STEP_SUMMARY
