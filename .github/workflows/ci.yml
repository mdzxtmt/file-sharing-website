name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'

jobs:
  # 代码质量检查和构建验证
  quality-check:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
            
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
        
      - name: Run TypeScript type check
        run: npm run type-check
        continue-on-error: false
        
      - name: Build project
        run: npm run build
        env:
          # 使用示例环境变量进行构建测试
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
          
      - name: Run service configuration check
        run: npm run check-services
        continue-on-error: true
        
      - name: Upload build artifacts
        if: matrix.node-version == 18
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: .next/
          retention-days: 1

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
        
      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for security vulnerabilities..."
          npx audit-ci --moderate
        continue-on-error: true

  # 项目结构验证
  structure-check:
    name: Project Structure Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify required files
        run: |
          echo "📁 Checking project structure..."
          
          # 检查必需文件
          required_files=(
            "README.md"
            "package.json"
            "next.config.js"
            "tailwind.config.ts"
            "tsconfig.json"
            ".env.local"
            "docs/deployment-guide.md"
          )
          
          missing_files=()
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              missing_files+=("$file")
            fi
          done
          
          # 检查必需目录
          required_dirs=(
            "app"
            "components"
            "lib"
            "types"
            "utils"
            "stores"
            "sql"
            "docs"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/ directory exists"
            else
              echo "❌ $dir/ directory missing"
              missing_files+=("$dir/")
            fi
          done
          
          if [ ${#missing_files[@]} -eq 0 ]; then
            echo "🎉 All required files and directories exist!"
          else
            echo "⚠️ Missing files/directories: ${missing_files[*]}"
            exit 1
          fi

  # 生成状态报告
  status-report:
    name: Generate Status Report
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan, structure-check]
    if: always()
    
    steps:
      - name: Generate CI Status Report
        run: |
          echo "## 🔍 CI/CD Pipeline Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Quality Check Status
          if [ "${{ needs.quality-check.result }}" == "success" ]; then
            echo "✅ **Code Quality & Build Check**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality & Build Check**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security Scan Status
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ **Security Scan**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security Scan**: Issues Found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Structure Check Status
          if [ "${{ needs.structure-check.result }}" == "success" ]; then
            echo "✅ **Project Structure Check**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Project Structure Check**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.quality-check.result }}" == "success" ] && [ "${{ needs.structure-check.result }}" == "success" ]; then
            echo "- ✅ Ready for deployment" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Automatic deployment will trigger on merge to main" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Fix failing checks before deployment" >> $GITHUB_STEP_SUMMARY
            echo "- 📖 Check the job logs for detailed error information" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by GitHub Actions CI/CD Pipeline*" >> $GITHUB_STEP_SUMMARY
