name: Deploy to Vercel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # PR预览部署
  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT
          
      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Preview deployment')
            );
            
            const body = `## 🚀 Preview Deployment
            
            ✅ **Preview URL**: ${{ steps.deploy.outputs.preview_url }}
            
            📊 **Deployment Details**:
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Branch**: ${context.ref.replace('refs/heads/', '')}
            - **Environment**: Preview
            
            ---
            *Deployed via GitHub Actions*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Staging环境部署
  staging-deploy:
    name: Staging Deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: []
    
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run pre-deployment checks
        run: |
          npm run ci:check
          npm run verify-supabase || echo "Supabase verification skipped in staging"
          
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          
      - name: Deploy to Staging
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "staging_url=$url" >> $GITHUB_OUTPUT
          
      - name: Run post-deployment health check
        run: |
          echo "🔍 Running health check on staging deployment..."
          sleep 30  # Wait for deployment to be ready
          
          # Basic health check
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.staging_url }}/api/test" || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Staging health check passed"
          else
            echo "❌ Staging health check failed (HTTP $response)"
            exit 1
          fi

  # Production环境部署
  production-deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: []
    
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run comprehensive pre-deployment checks
        run: |
          echo "🔍 Running comprehensive pre-deployment checks..."
          npm run ci:check
          npm run verify-supabase || echo "Supabase verification will be checked post-deployment"
          npm run audit:security
          
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          
      - name: Deploy to Production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$url" >> $GITHUB_OUTPUT
          
      - name: Run post-deployment verification
        run: |
          echo "🔍 Running post-deployment verification..."
          sleep 60  # Wait for deployment to be fully ready
          
          # Comprehensive health check
          base_url="${{ steps.deploy.outputs.production_url }}"
          
          # Check main page
          main_response=$(curl -s -o /dev/null -w "%{http_code}" "$base_url" || echo "000")
          echo "Main page: HTTP $main_response"
          
          # Check API health
          api_response=$(curl -s -o /dev/null -w "%{http_code}" "$base_url/api/test" || echo "000")
          echo "API health: HTTP $api_response"
          
          # Check files page
          files_response=$(curl -s -o /dev/null -w "%{http_code}" "$base_url/files" || echo "000")
          echo "Files page: HTTP $files_response"
          
          if [ "$main_response" = "200" ] && [ "$api_response" = "200" ] && [ "$files_response" = "200" ]; then
            echo "✅ Production deployment verification passed"
          else
            echo "❌ Production deployment verification failed"
            echo "Main: $main_response, API: $api_response, Files: $files_response"
            exit 1
          fi
          
      - name: Create deployment summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Production URL**: ${{ steps.deploy.outputs.production_url }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Commit**: ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
          echo "🌿 **Branch**: ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Deployed at**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "- Main page: ✅ Accessible" >> $GITHUB_STEP_SUMMARY
          echo "- API endpoints: ✅ Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- Files page: ✅ Functional" >> $GITHUB_STEP_SUMMARY
